<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e7490">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ANGEL'S GROUP"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{var _t=localStorage.getItem("angels_theme");if(_t)document.documentElement.dataset.theme=_t}catch(e){}</script>
<title>ANGEL'S GROUP ERP — Livraisons</title>
<style>
:root{--b:#0e7490;--b2:#0b3b4c;--b3:#1aa3c6;--bg:#f1f6f8;--card:#fff;--tx:#1b2240;--mu:#6b7390;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#d6e4ea;--okbg:#e3f5ea;--wabg:#fff1d6;--erbg:#fde5e5;--bbg:#dff3f8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.shell{display:flex;min-height:100vh}
aside{width:230px;background:var(--b2);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;font-size:16px;padding:6px 8px 12px;line-height:1.2}
aside .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
.clkbox{margin:0 8px 12px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.1);line-height:1.25}.clkbox b{display:block;font-size:22px;letter-spacing:1px;font-variant-numeric:tabular-nums}.clkbox span{font-size:11.5px;opacity:.8;text-transform:capitalize}
aside a{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;color:#dbe2ff;cursor:pointer;text-decoration:none}
aside a:hover{background:rgba(255,255,255,.1)}
aside a.on{background:#fff;color:var(--b2);font-weight:700}
aside .who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:12px}
main{flex:1;padding:18px;min-width:0}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:800}
.kpi .l{color:var(--mu);font-size:12px}
.kpi.w .v{color:var(--wa)}.kpi.e .v{color:var(--er)}.kpi.o .v{color:var(--ok)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);background:#f7f8fd;white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px}
.tw table{margin:0}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--b2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--b)}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn.wa{background:var(--wa)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bbg);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.er{background:var(--erbg);color:var(--er)}.badge.mu{background:#eceef5;color:var(--mu)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu)}.sm{font-size:12px}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
label{display:block;font-size:12px;color:var(--mu);font-weight:600}
label input,label select,label textarea{margin-top:3px;color:var(--tx);font-weight:400;font-size:14px}
.g2{display:grid;gap:10px;grid-template-columns:1fr 1fr}.g3{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
.ov{position:fixed;inset:0;background:rgba(10,20,60,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:14px;width:100%;max-width:520px}.md.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bd)}
.mb{padding:14px 16px;display:grid;gap:10px}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.x{background:none;border:0;font-size:18px;cursor:pointer}
.sec{font-weight:700;margin-top:4px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:6px;width:min(92vw,420px)}
.t{background:#1b2240;color:#fff;padding:10px 14px;border-radius:10px}.t.err{background:var(--er)}.t.ok{background:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.al{padding:8px 12px;border-radius:8px;margin-bottom:6px;background:var(--bbg)}.al.warn{background:var(--wabg)}.al.err{background:var(--erbg)}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;background:var(--b);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
.login{max-width:380px;margin:8vh auto;padding:0 14px}
.login.hero{max-width:none;margin:0;padding:0;display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.hero-l{background:linear-gradient(155deg,var(--b2) 0%,var(--b) 60%,var(--b3) 100%);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero-l h1{font-size:30px;line-height:1.15;margin:0}.hero-l p{margin:0;opacity:.88;font-size:15px}
.hero-l ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}.hero-l li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.hero-l li b{display:block;font-size:14px}.hero-l li span.i{font-size:20px;line-height:1.1}
.hero-r{padding:40px 32px;display:flex;flex-direction:column;justify-content:center;background:var(--bg)}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;transition:.15s}
.pcard:hover,.pcard:focus-visible{border-color:var(--b);box-shadow:0 4px 14px rgba(26,58,168,.15);transform:translateY(-1px)}
.pcard .ic{font-size:22px}.pcard b{display:block;font-size:13px}.pcard small{color:var(--mu);font-size:11.5px}
.welcome{background:linear-gradient(120deg,var(--b2),var(--b));color:#fff;border-radius:14px;padding:18px 20px;margin:10px 0 4px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.welcome h2{margin:0 0 4px;color:#fff;font-size:20px}.welcome .big{font-size:13px;opacity:.9}
.welcome .hl{display:flex;gap:22px;flex-wrap:wrap}.welcome .hl div{text-align:center}.welcome .hl b{display:block;font-size:24px}.welcome .hl span{font-size:11.5px;opacity:.85}
.tour{border:2px dashed var(--b);background:var(--bbg);border-radius:14px;padding:14px 16px;margin:12px 0}
.tour .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.tour .st{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13px}
.tour .st:hover{border-color:var(--b)}.tour .st b{display:block;color:var(--b2)}.tour .st small{color:var(--mu)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;background:var(--bd)}
.slot{border:1px dashed var(--bd);border-radius:10px;padding:8px;text-align:center;background:#fff}.slot img{max-width:100%;max-height:130px;border-radius:6px;display:block;margin:6px auto}
.slot .ph{height:70px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px}.slot b{font-size:12px}

html[data-theme=emeraude]{--b:#0f7b5f;--b2:#08523f;--b3:#17a67f;--bbg:#e0f4ee;--bg:#f1f7f5;--bd:#d9e6e1}
html[data-theme=orange]{--b:#c9500a;--b2:#7d3004;--b3:#f27a2c;--bbg:#fdebdd;--bg:#faf5f1;--bd:#ecdfd5}
html[data-theme=violet]{--b:#6a32c9;--b2:#3e1a85;--b3:#8a55e6;--bbg:#eee6fb;--bg:#f6f3fb;--bd:#e4dcf2}
html[data-theme=bleu]{--b:#1a3aa8;--b2:#0f2570;--b3:#2a55d6;--bbg:#e5ebfb;--bg:#f2f4fa;--bd:#dfe3f0}
html[data-theme=or]{--b:#9a6f12;--b2:#15171d;--b3:#c8962a;--bbg:#f6edd8;--bg:#f5f4f1;--bd:#e6e2d8}
.themes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.themes button{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd);transition:.15s}.themes button:hover{transform:scale(1.15)}.themes button.on{box-shadow:0 0 0 2px var(--tx)}
aside .themes{margin:6px 0 2px}aside .themes button{width:18px;height:18px;border-color:rgba(255,255,255,.5)}
.stp{list-style:none;margin:12px 0;padding:0}.stp li{display:flex;gap:10px;align-items:center;padding:7px 0;position:relative;color:var(--mu)}
.stp li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;flex-shrink:0}
.stp li.ok{color:var(--tx)}.stp li.ok i{background:var(--b);border-color:var(--b);color:#fff}.stp li.cur{color:var(--b2);font-weight:700}.stp li.cur i{border-color:var(--b);box-shadow:0 0 0 4px var(--bbg)}
.stp li small{margin-left:auto;font-weight:400}.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}.stars button{all:unset;cursor:pointer;font-size:34px;line-height:1;color:#cfd5e3}.stars button.on{color:#f5a700}
.cm{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}#cm_map{height:calc(100vh - 230px);min-height:420px;border-radius:12px;overflow:hidden;background:#e8ebf5;border:1px solid var(--bd)}
.cmside{max-height:calc(100vh - 230px);min-height:420px;overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:12px}.cmside .it{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer}.cmside .it:hover{background:var(--bbg)}.cmside .it b{font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px;background:#999}.dot.libre{background:#118a4b}.dot.mission{background:var(--b)}.dot.indispo{background:#8b93a8}
.mk{width:34px;height:34px;border-radius:50%;color:#fff;font:700 12px/30px system-ui;text-align:center;border:3px solid #fff;box-shadow:0 2px 8px #0005;transform:translate(-50%,-50%)}.mk.libre{background:#118a4b}.mk.mission{background:var(--b)}.mk.indispo{background:#8b93a8}.mk.old{opacity:.55;border-style:dashed;border-color:#b86e00}
.mkd{font-size:24px;line-height:24px;transform:translate(-50%,-100%);filter:drop-shadow(0 1px 2px #0006)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin:6px 0 10px}.lgd span{display:inline-flex;gap:5px;align-items:center}
@media(max-width:900px){.cm{grid-template-columns:1fr}.cmside{max-height:260px;min-height:0}#cm_map{height:60vh}}
.cnt{width:90px;text-align:right}.wph{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.wthumb{position:relative;display:inline-flex;flex-direction:column;gap:3px}.wthumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}.wthumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--er);color:#fff;font-size:11px;cursor:pointer;line-height:20px;padding:0}
.wl{width:100%;border-collapse:collapse;margin:8px 0}.wl th{text-align:left;font-size:12px;color:var(--mu)}.wl td{padding:3px 4px}.wl input{width:100%}.wl .wtot{white-space:nowrap}.wcard{border-left:4px solid var(--b)}.ecp{color:var(--ok);font-weight:700}.ecn{color:var(--er);font-weight:700}tr.tot td{font-weight:800;background:var(--bbg)}
.kpi{transition:.15s}.kpi:hover{box-shadow:0 4px 14px rgba(15,37,112,.12);transform:translateY(-1px)}
@media(max-width:760px){.login.hero{grid-template-columns:1fr}.hero-l{padding:28px 22px;min-height:0}.hero-l h1{font-size:23px}.hero-r{padding:22px 16px}.pcards{grid-template-columns:1fr}}

.login .card{padding:20px}
.lv{max-width:520px;margin:0 auto;padding:12px}
.lvh{background:var(--b2);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.mc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:12px;display:grid;gap:8px}
.mc.urg{border-left:5px solid var(--er)}
.mc .btn{padding:11px 14px}
.mc .row{display:flex;gap:8px;flex-wrap:wrap}.mc .row .btn{flex:1}
.pill{background:#f3f5fb;border-radius:8px;padding:6px 9px}
.amt{font-size:20px;font-weight:800;color:var(--b2)}
@media(max-width:820px){
 .shell{display:block}
 aside{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px}
 aside .brand,aside .who{display:none}
 aside a{white-space:nowrap}
 main{padding:12px}.g2,.g3{grid-template-columns:1fr}
}
@media print{aside,.noprint{display:none}}
</style>
</head>

/* ---------- Collecte des colis chez les vendeurs (après confirmation de leurs commandes) ---------- */
const COL_L={planifiee:"Planifiée",acceptee:"Acceptée",en_route:"En route",collectee:"Collectée · vers le dépôt",recue:"Réceptionnée",echouee:"Non réalisée",annulee:"Annulée"};
const COL_K={planifiee:"wa",acceptee:"",en_route:"",collectee:"wa",recue:"ok",echouee:"er",annulee:"mu"};
const colOpen=c=>["planifiee","acceptee","en_route","collectee"].includes(c.statut);
const colOf=cid=>(S.collectes||[]).find(c=>colOpen(c)&&c.lignes.some(l=>l.commande_id===cid));
const aCollecter=vid=>S.commandes.filter(c=>c.vendeur_id===vid&&c.statut==="confirmee"&&!colOf(c.id));
const colAdrTxt=a=>a&&(a.zone||a.quartier||a.repere)?[a.zone,a.quartier,a.repere].filter(Boolean).join(" · "):"adresse non renseignée";
const colBadge=c=>badge(COL_L[c.statut]||c.statut,COL_K[c.statut]||"");
const dtLocal=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const colVend=c=>c.vendeur_nom||(vendOf(c.vendeur_id)||{}).nom||"Vendeur";
const colTel=c=>c.vendeur_tel||(vendOf(c.vendeur_id)||{}).tel||"";
const colLiv=c=>c.livreur_prenom||((liv(c.livreur_id)||{}).nom||"").split(" ")[0]||"—";
function colLocal(id,action,p){
 const c=(S.collectes||[]).find(x=>x.id===id);if(!c)throw new Error("Collecte introuvable");p=p||{};
 const lv=ME.role==="livreur"?livreurOf(ME):null,mine=lv&&c.livreur_id===lv.id;
 if(["accepter","refuser","partir","collecter","echec"].includes(action)&&!mine)throw new Error("Accès refusé pour votre profil");
 if(action==="accepter"){if(c.statut!=="planifiee")throw new Error("Cette collecte ne peut plus être acceptée");c.statut="acceptee";c.accept_at=now()}
 else if(action==="refuser"||action==="echec"){if(!["planifiee","acceptee","en_route"].includes(c.statut))throw new Error("Collecte déjà terminée");if(!(p.motif||"").trim())throw new Error("Motif obligatoire");c.statut="echouee";c.motif=p.motif.trim();audit("Collecte non réalisée",c.numero+" — "+c.motif)}
 else if(action==="partir"){if(c.statut!=="acceptee")throw new Error("Acceptez d'abord la collecte");c.statut="en_route";c.depart_at=now()}
 else if(action==="collecter"){
  if(!["acceptee","en_route"].includes(c.statut))throw new Error("Cette collecte n'est pas en cours");if(c.essais_code>=5)throw new Error("Trop d'essais de code : contactez le superviseur");
  if(String(p.code||"").trim()!==c.code){c.essais_code=(c.essais_code||0)+1;return{ok:false,erreur:"Code du vendeur incorrect",essais_restants:5-c.essais_code}}
  let tot=0;c.lignes.forEach(l=>{const n=Math.max(0,Math.floor(+((p.colis||{})[l.commande_id])||0));l.colis_collectes=n;tot+=n});if(!tot)throw new Error("Indiquez le nombre de colis pris pour au moins une commande");
  c.statut="collectee";c.collecte_at=now();audit("Colis collectés",c.numero+" — "+tot+" colis")}
 else if(action==="recevoir"){
  if(!can("admin","preparateur"))throw new Error("Accès refusé pour votre profil");if(c.statut!=="collectee")throw new Error("Cette collecte n'est pas arrivée au dépôt");
  let inc=0;const incident=(cat,l,desc)=>{S.seq.inc++;S.incidents.push({id:uid("i"),ref:"INC-"+String(S.seq.inc).padStart(4,"0"),ts:now(),cat,commande_id:l.commande_id,par:who(),desc,statut:"ouvert",decision:""});audit("Incident ouvert automatiquement","INC-"+String(S.seq.inc).padStart(4,"0")+" — "+cat);inc++};
  c.lignes.forEach(l=>{const n=Math.max(0,Math.floor(+((p.recus||{})[l.commande_id])));l.colis_recus=isNaN(n)?(l.colis_collectes||0):n;const o=cmd(l.commande_id),col=l.colis_collectes||0;
   if(col>0&&l.colis_recus>=col&&o&&o.statut==="confirmee")setStatut(o,"preparation","Marchandise reçue — collecte "+c.numero);
   if(col===0)incident("Colis manquant",l,`Collecte ${c.numero} chez ${colVend(c)} : la commande ${l.numero} n'a pas été remise par le fournisseur (0 colis collecté). La commande reste « confirmée ».`);
   else if(l.colis_recus<col)incident("Colis manquant",l,`Collecte ${c.numero} chez ${colVend(c)} : ${l.colis_recus} colis reçu(s) au dépôt sur ${col} collecté(s) pour la commande ${l.numero} (${col-l.colis_recus} manquant(s)). La commande reste « confirmée ».`);
   else if(l.colis_recus>col)incident("Écart de colis",l,`Collecte ${c.numero} chez ${colVend(c)} : ${l.colis_recus} colis reçu(s) au dépôt pour ${col} collecté(s) sur la commande ${l.numero} (${l.colis_recus-col} en trop).`)});
  c.statut="recue";c.recue_at=now();c.recue_par_nom=ME.nom;audit("Collecte réceptionnée",c.numero);return{ok:true,incidents:inc}}
 else if(action==="reaffecter"){
  if(!can("admin","superviseur"))throw new Error("Accès refusé pour votre profil");if(!["planifiee","acceptee","echouee"].includes(c.statut))throw new Error("Cette collecte ne peut plus être réaffectée");
  const l=liv(p.livreur);if(!l)throw new Error("Livreur introuvable");if(S.config.dossier_obligatoire&&!dossierEtat(l).ok)throw new Error("Dossier du livreur incomplet ou expiré : mission impossible");
  c.livreur_id=l.id;c.livreur_prenom=l.nom.split(" ")[0];c.statut="planifiee";c.motif=null;c.accept_at=null;c.essais_code=0;if(p.creneau)c.creneau=p.creneau;audit("Collecte réaffectée",c.numero)}
 else if(action==="annuler"){
  if(!can("admin","superviseur"))throw new Error("Accès refusé pour votre profil");if(["recue","annulee"].includes(c.statut))throw new Error("Collecte déjà clôturée");if(!(p.motif||"").trim())throw new Error("Motif obligatoire");
  c.statut="annulee";c.motif=p.motif.trim();audit("Collecte annulée",c.numero+" — "+c.motif)}
 else throw new Error("Action inconnue");
 return{ok:true}}
function colPlanLocal(a){
 const v=vendOf(a.vendeur_id),l=liv(a.livreur);if(!v||!l)throw new Error("Vendeur ou livreur introuvable");
 if(S.config.dossier_obligatoire&&!dossierEtat(l).ok)throw new Error("Dossier du livreur incomplet ou expiré : mission impossible");
 if(!a.commandes.length)throw new Error("Sélectionnez au moins une commande");
 a.commandes.forEach(id=>{const c=cmd(id);if(!c||c.vendeur_id!==v.id)throw new Error("Commande étrangère à ce vendeur");if(c.statut!=="confirmee")throw new Error("Commande "+c.numero+" : elle doit être « confirmée »");if(colOf(id))throw new Error("Commande "+c.numero+" : une collecte est déjà en cours")});
 if(a.adresse)v.adresse_collecte=a.adresse;if(!v.adresse_collecte)throw new Error("Adresse de collecte du vendeur non renseignée");
 const y=new Date().getFullYear(),n=(S.collectes||[]).filter(c=>c.numero.startsWith("COL-"+y)).length+1;
 const col={id:uid("col"),numero:"COL-"+y+"-"+String(n).padStart(4,"0"),vendeur_id:v.id,vendeur_nom:v.nom,vendeur_tel:v.tel,livreur_id:l.id,livreur_prenom:l.nom.split(" ")[0],statut:"planifiee",creneau:a.creneau,note:a.note||"",adresse:Object.assign({},v.adresse_collecte),essais_code:0,cree_le:now(),cree_par_nom:ME.nom,
  code:String(Math.floor(Math.random()*10000)).padStart(4,"0"),lignes:a.commandes.map(id=>{const c=cmd(id);return{commande_id:id,numero:c.numero,resume:c.lignes.map(x=>x.qte+"× "+lname(x)).join(", "),colis_collectes:null,colis_recus:null}})};
 S.collectes=S.collectes||[];S.collectes.push(col);audit("Collecte planifiée",col.numero+" — "+v.nom);return col}
async function colDo(id,action,p,msg){
 try{let r;if(CL.on){r=await CL.rpc("collecte_action",{p_collecte:id,p_action:action,p:p||{}});await refresh()}else{r=colLocal(id,action,p);save()}
  if(r&&r.ok===false){render();toast(r.erreur+(r.essais_restants!=null?" ("+r.essais_restants+" essai(s) restant(s))":""),"err");return false}
  if(msg)toast(msg+(r&&r.incidents?" — "+r.incidents+" incident(s) ouvert(s) pour écart (page Incidents)":""),r&&r.incidents?"err":"ok");render();return true}catch(e){toast(fixErr(e),"err");return false}}

const ymd=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
function perRange(pre){const k=ui[pre+"p"]||"30",t=new Date();let du,au=ymd(t);const back=n=>{const d=new Date(t);d.setDate(d.getDate()-n);return ymd(d)};
 if(k==="0")du=au;else if(k==="7")du=back(6);else if(k==="30")du=back(29);else if(k==="m")du=ymd(new Date(t.getFullYear(),t.getMonth(),1));
 else if(k==="mp"){du=ymd(new Date(t.getFullYear(),t.getMonth()-1,1));au=ymd(new Date(t.getFullYear(),t.getMonth(),0))}
 else if(k==="t")du=ymd(new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1));else if(k==="a")du=t.getFullYear()+"-01-01";

function journalLocal(du,au,pid,type){
 const by={};S.stock_mvts.map((m,i)=>({m,i})).sort((a,b)=>new Date(a.m.ts)-new Date(b.m.ts)||a.i-b.i).forEach(x=>(by[x.m.produit_id]=by[x.m.produit_id]||[]).push(x.m));
 const rows=[];Object.entries(by).forEach(([id,list])=>{const p=prod(id);let after=p?p.stock:0;for(let i=list.length-1;i>=0;i--){const m=list[i];rows.push({id:m.id,ts:m.ts,produit_id:id,code:p?p.code:"?",nom:p?p.nom:"?",type:m.type,qte:m.qte,solde:after,ref:m.ref,par_nom:m.par});after-=m.qte}});
 return rows.filter(r=>{const d=ymd(r.ts);return d>=du&&d<=au&&(!pid||r.produit_id===pid)&&(!type||r.type===type)}).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function etatStockLocal(du,au){
 return S.produits.map(p=>{const ms=S.stock_mvts.filter(m=>m.produit_id===p.id),sum=f=>ms.filter(f).reduce((t,m)=>t+m.qte,0),inP=m=>{const d=ymd(m.ts);return d>=du&&d<=au};
  return{produit_id:p.id,code:p.code,nom:p.nom,cout:p.cout||0,prix:p.prix,ouverture:p.stock-sum(m=>ymd(m.ts)>=du),entrees:sum(m=>inP(m)&&["entree","stock_initial"].includes(m.type)),sorties:sum(m=>inP(m)&&m.type==="sortie_commande"),
   retours:sum(m=>inP(m)&&["annulation","retour_stock"].includes(m.type)),ajustements:sum(m=>inP(m)&&m.type==="ajustement"),inventaires:sum(m=>inP(m)&&m.type==="inventaire"),cloture:p.stock-sum(m=>ymd(m.ts)>au)}})}

function etatActivite(du,au){
 const inR=t=>{if(!t)return false;const d=ymd(t);return d>=du&&d<=au},sum=a=>a.reduce((t,x)=>t+(+x.montant||0),0);
 const liv=S.livraisons.filter(l=>l.statut==="livree"&&inR(l.fin_at)),ech=S.livraisons.filter(l=>l.statut==="echouee"&&inR(l.fin_at));
 const cs=liv.map(l=>cmd(l.commande_id)).filter(Boolean);
 return{crees:S.commandes.filter(c=>inR(c.date)).length,livrees:liv.length,echouees:ech.length,annulees:S.commandes.filter(c=>c.statut==="annulee"&&inR(c.date)).length,
  ca:cs.reduce((t,c)=>t+c.total,0),frais:cs.reduce((t,c)=>t+(c.frais||0),0),
  taux:liv.length+ech.length?liv.length/(liv.length+ech.length)*100:0,
  encaisse:sum(S.fonds.filter(f=>["encaissement","acompte"].includes(f.type)&&f.mode!=="Payé au vendeur"&&inR(f.ts))),reverse:sum(S.fonds.filter(f=>f.type==="reversement"&&inR(f.ts))),
  encMomo:sum(S.fonds.filter(f=>f.type==="encaissement"&&!f.direct&&estMobile(f.mode)&&inR(f.ts))),encDirect:sum(S.fonds.filter(f=>f.type==="encaissement"&&f.direct&&inR(f.ts))),revMomo:sum(S.fonds.filter(f=>f.type==="reversement"&&estMobile(f.mode)&&inR(f.ts))),
  dep:sum(S.depenses.filter(d=>inR(d.ts))),paie:sum(S.paie.filter(x=>inR(x.ts))),comm:liv.reduce((t,l)=>t+commissionLiv(l),0),regl:sum(S.reglements.filter(x=>inR(x.ts)))}}

 <tr class="tot"><td>Total</td><td class="n">${T.ouverture}</td><td class="n">${sgn(T.entrees)}</td><td class="n">${T.sorties}</td><td class="n">${sgn(T.retours)}</td><td class="n">${sgn(T.ajustements)}</td><td class="n">${sgn(T.inventaires)}</td><td class="n">${T.cloture}</td><td class="n">${fcfa(T.vc)}</td><td class="n">${fcfa(T.vv)}</td></tr></table>`;
 if(a)h+=`<h2>2. Activité de livraison</h2><table><tr><td>Commandes créées</td><td class="n">${a.crees}</td></tr><tr><td>Livraisons réussies</td><td class="n">${a.livrees}</td></tr><tr><td>Livraisons échouées</td><td class="n">${a.echouees}</td></tr><tr><td>Commandes annulées</td><td class="n">${a.annulees}</td></tr><tr><td>Taux de réussite</td><td class="n">${a.taux.toFixed(0)} %</td></tr><tr><td>Montant des commandes livrées</td><td class="n">${fcfa(a.ca)}</td></tr><tr><td>dont frais de livraison</td><td class="n">${fcfa(a.frais)}</td></tr></table>`;

function simulerPos(){const t0=new Date().toISOString();S.livreurs.forEach(l=>{if(S.pos[l.id]&&S.pos[l.id].ts&&Date.now()-new Date(S.pos[l.id].ts)<3600000)S.pos[l.id]=Object.assign({},S.pos[l.id],{ts:t0})});S.livraisons.filter(l=>l.statut==="en_cours").forEach(l=>{const c=cmd(l.commande_id),g=c&&c.adr.gps,p=S.pos[l.livreur_id];if(!g||!p)return;
 const d=Math.hypot(g.lat-p.lat,g.lng-p.lng);if(d<.0004)return;const k=.0006/d;S.pos[l.livreur_id]=Object.assign({},p,{lat:p.lat+(g.lat-p.lat)*Math.min(1,k),lng:p.lng+(g.lng-p.lng)*Math.min(1,k),ts:new Date().toISOString()})})}

function alertes(){
 const a=[],t=Date.now();
 S.livraisons.filter(isActive).forEach(l=>{const c=cmd(l.commande_id),z=zone(c.adr.zone),lim=(z?z.delai_min:60),lv=liv(l.livreur_id);
  if((t-new Date(l.affectee_at))/60000>lim)a.push({k:"warn",m:`Retard : ${c.numero} (${lv.nom}) — délai prévu de ${lim} min dépassé`});
  if(l.statut==="acceptee"&&(t-new Date(l.accept_at))/60000>15)a.push({k:"warn",m:`Course acceptée non démarrée depuis plus de 15 min : ${c.numero} (${lv.nom})`});
  if(l.statut==="affectee"&&(t-new Date(l.affectee_at))/60000>10)a.push({k:"warn",m:`Mission non acceptée depuis plus de 10 min : ${c.numero} (${lv.nom})`});
  if(l.statut==="en_cours"){const f=fraicheur(S.pos[l.livreur_id]);if(f.k!=="ok")a.push({k:"",m:`GPS ${f.k==="mu"?"absent":"non récent"} pour ${lv.nom} (${c.numero}). Cela ne prouve pas une faute : réseau, batterie ou téléphone possibles.`})}});
 const ne=S.commandes.filter(c=>c.statut==="prete"&&!c.colis).length;if(ne&&S.config.etiq_scan)a.push({k:"",m:`${ne} commande(s) prête(s) sans étiquettes colis : imprimez-les avant la remise au livreur`});
 if(ME&&["admin","superviseur"].includes(ME.role))S.livreurs.forEach(l=>{const e=dossierEtat(l);if(!e.ok)a.push({k:S.config.dossier_obligatoire?"err":"warn",m:`Dossier de ${l.nom} incomplet : ${e.manques.slice(0,3).join(", ")}${e.manques.length>3?"…":""}${S.config.dossier_obligatoire?" — affectation bloquée":""}`});else if(e.bientot.length)a.push({k:"warn",m:`${l.nom} : échéance proche pour ${e.bientot.join(" et ")} (moins de 30 jours)`})});
 if(ME&&["admin","superviseur"].includes(ME.role)){const nc=S.vendeurs.reduce((t,v)=>t+aCollecter(v.id).length,0);if(nc)a.push({k:"warn",m:`${nc} commande(s) de vendeurs confirmée(s) à collecter chez le vendeur (Centre de livraison → Collectes)`});(S.collectes||[]).forEach(c=>{if(c.statut==="echouee")a.push({k:"err",m:`Collecte ${c.numero} non réalisée (${c.motif||"motif non précisé"}) : à réaffecter`});else if(c.statut==="planifiee"&&c.creneau&&Date.now()-new Date(c.creneau)>15*60000)a.push({k:"warn",m:`Collecte ${c.numero} : créneau dépassé, livreur sans réponse`})})}
 if(ME&&["admin","preparateur"].includes(ME.role)){const nr=(S.collectes||[]).filter(c=>c.statut==="collectee").length;if(nr)a.push({k:"",m:`${nr} collecte(s) arrivée(s) à réceptionner au dépôt`})}
 const nn=S.notifs.filter(n=>n.statut==="a_envoyer").length;if(nn)a.push({k:"",m:`${nn} message(s) client à envoyer (menu Notifications)`});
 const ec=S.livraisons.filter(l=>l.ecart_statut==="a_valider").length;if(ec)a.push({k:"err",m:`${ec} écart(s) d'encaissement à valider`});
 const nv=S.commandes.filter(c=>c.vendeur_id&&c.statut==="attente").length;if(nv)a.push({k:"warn",m:`${nv} commande(s) de vendeurs partenaires à confirmer`});
 const nf=S.commandes.filter(c=>c.statut==="echouee").length;if(nf)a.push({k:"warn",m:`${nf} livraison(s) échouée(s) à traiter`});
 const ng=S.commandes.filter(c=>!["livree","annulee","retour_recu","brouillon"].includes(c.statut)&&!c.adr.gps).length;if(ng)a.push({k:"",m:`${ng} commande(s) active(s) sans position GPS : envoyez le lien du portail au client`});
 const np=S.commandes.filter(c=>c.statut==="prete").length;if(np)a.push({k:"",m:`${np} commande(s) prête(s) à affecter`});
 const rr=S.commandes.filter(c=>c.statut==="retour_cours").length;if(rr)a.push({k:"",m:`${rr} retour(s) à réceptionner`});
 S.produits.filter(p=>p.actif&&p.stock<=p.seuil).forEach(p=>a.push({k:"warn",m:`Stock bas : ${p.nom} (${p.stock})`}));
 S.motos.filter(m=>m.statut!=="disponible"&&m.statut!=="affectee").forEach(m=>a.push({k:"warn",m:`Moto ${m.immat} : ${m.statut}`}));
 S.motos.filter(m=>m.km>=m.prochain_km).forEach(m=>a.push({k:"warn",m:`Entretien dû : moto ${m.immat} (${m.km} km)`}));
 return a}
function statsPer(){
 const t0=periodStart(),inP=i=>i&&new Date(i).getTime()>=t0;
 const fz=ui.dz||"",fl=ui.dl||"",fc=ui.dc||"";
 const okC=c=>(!fz||c.adr.zone===fz)&&(!fc||c.canal===fc),okL=l=>(!fl||l.livreur_id===fl)&&okC(cmd(l.commande_id));
 const L=S.livraisons.filter(okL),liv_ok=L.filter(l=>l.statut==="livree"&&inP(l.fin_at)),liv_ko=L.filter(l=>l.statut==="echouee"&&inP(l.fin_at));
 const cmds=S.commandes.filter(c=>inP(c.date)&&okC(c)&&(!fl||S.livraisons.some(l=>l.commande_id===c.id&&l.livreur_id===fl)));
 const dans=liv_ok.filter(l=>{const z=zone(cmd(l.commande_id).adr.zone);return(new Date(l.fin_at)-new Date(l.affectee_at))/60000<=(z?z.delai_min:60)}).length;
 const durs=liv_ok.map(l=>(new Date(l.fin_at)-new Date(l.depart_at||l.affectee_at))/60000);
 const cmdLiv=new Set(L.filter(l=>inP(l.affectee_at)).map(l=>l.commande_id));
 const tent=cmdLiv.size?[...cmdLiv].reduce((a,id)=>a+livsOf(id).filter(l=>!["reaffectee","refusee","annulee"].includes(l.statut)).length,0)/cmdLiv.size:0;
 const motifs={};liv_ko.forEach(l=>motifs[l.motif_echec]=(motifs[l.motif_echec]||0)+1);
 const frais=liv_ok.reduce((a,l)=>a+cmd(l.commande_id).frais,0),comm=liv_ok.reduce((a,l)=>a+commissionLiv(l),0);
 const dep=S.depenses.filter(d=>inP(d.ts)&&(!fl||d.livreur_id===fl)&&((!fz&&!fc)||(d.commande_id&&okC(cmd(d.commande_id))))).reduce((a,d)=>a+d.montant,0);
 return{cmds:cmds.length,ok:liv_ok.length,ko:liv_ko.length,taux:liv_ok.length+liv_ko.length?liv_ok.length/(liv_ok.length+liv_ko.length)*100:0,
  delais:liv_ok.length?dans/liv_ok.length*100:0,duree:durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:0,
  parLiv:(fl?1:S.livreurs.length)?liv_ok.length/(fl?1:S.livreurs.length):0,tent,retours:S.commandes.filter(c=>["retour_cours","retour_recu"].includes(c.statut)).length,
  motifs:Object.entries(motifs).sort((a,b)=>b[1]-a[1]),
  ca:liv_ok.reduce((a,l)=>a+cmd(l.commande_id).total,0),frais,comm,dep,marge:frais-comm-dep,
  encaisse:S.fonds.filter(f=>f.type==="encaissement"&&inP(f.ts)&&(!fl||f.livreur_id===fl)&&okC(cmd(f.commande_id))).reduce((a,f)=>a+f.montant,0)}}

 const tot=Math.max(0,prods+(+$("#f_frais").value||0)-(+$("#f_remise").value||0));const pay=$("#f_pay").value;
 $("#f_acompte").disabled=pay!=="partiel";const ac=pay==="avance"?tot:pay==="partiel"?Math.min(+$("#f_acompte").value||0,tot):0;
 $("#t_prod").textContent=fcfa(prods);$("#t_tot").textContent=fcfa(tot);$("#t_solde").textContent=fcfa(tot-ac)}
document.addEventListener("change",e=>{
 if(!$("#mf")||!$("#f_client"))return;const t=e.target;
 if(t.id==="f_client")fillAdr();else if(t.id==="f_adr"){fillAdr()}
 else if(t.matches(".l_prod")){t.closest(".lrow").querySelector(".l_pu").value=t.selectedOptions[0].dataset.p;recalc()}
 else if(t.name==="a_zone")autoFrais();
 if(t.matches("#f_pay,#f_frais,#f_remise"))recalc()});

VIEWS.livreurs=()=>`<div class="between"><h1>Livreurs & motos</h1><div class="flex"><button class="btn" data-act="newLiv">➕ Livreur</button><button class="btn ghost" data-act="newMoto">➕ Moto</button></div></div>

 <h2>Motos</h2>${tbl(["Immatriculation","Modèle","Km","Prochain entretien","Statut","Affectée à","Coût d'entretien",""],S.motos.map(m=>{const l=S.livreurs.find(x=>x.moto_id===m.id),ce=S.entretiens.filter(e=>e.moto_id===m.id).reduce((a,e)=>a+e.cout,0);return`<tr><td><b>${esc(m.immat)}</b></td><td>${esc(m.modele)}</td><td>${m.km}</td><td>${m.prochain_km} km ${m.km>=m.prochain_km?badge("dû","er"):""}</td><td>${badge(m.statut,m.statut==="disponible"?"ok":"er")}</td><td>${l?esc(l.nom):"—"}</td><td>${fcfa(ce)}</td><td><button class="btn sm" data-act="entMoto" data-id="${m.id}">🔧 Entretien</button> <button class="btn sm ghost" data-act="histMoto" data-id="${m.id}">Historique</button> <button class="btn sm ghost" data-act="editMoto" data-id="${m.id}">Modifier</button></td></tr>`}))}

/* ---------- Dossier d'identité des livreurs ---------- */
const PIECES={cni:"Carte nationale d'identité",passeport:"Passeport",attestation:"Attestation d'identité",carte_consulaire:"Carte consulaire"};
const FKINDS=[["photo","Photo d'identité du livreur"],["piece_recto","Pièce d'identité — recto"],["piece_verso","Pièce d'identité — verso"],["permis","Permis de conduire"]];
function dossierEtat(l){
 const d=l.dossier||{},f=l.fichiers||{},m=[],t0=new Date().toISOString().slice(0,10),t30=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
 if(!d.piece_type||!(d.piece_numero||"").trim())m.push("pièce d'identité non renseignée");else if(!d.piece_expire||d.piece_expire<=t0)m.push("pièce d'identité expirée");
 if(!(d.permis_numero||"").trim())m.push("permis non renseigné");else if(!d.permis_expire||d.permis_expire<=t0)m.push("permis expiré");
 FKINDS.forEach(([k,t])=>{if(!f[k])m.push("« "+t+" » manquant")});
 if(!(d.contact_urgence_tel||"").trim())m.push("contact d'urgence");
 if(!d.consent_le)m.push("accord du livreur");
 const bientot=[d.piece_expire&&d.piece_expire>t0&&d.piece_expire<=t30?"la pièce d'identité":"",d.permis_expire&&d.permis_expire>t0&&d.permis_expire<=t30?"le permis":""].filter(Boolean);
 return{ok:!m.length,manques:m,bientot}}
const avatarL=l=>{const f=l.fichiers&&l.fichiers.photo;return f&&(f.mini||f.full)?`<img class="av" alt="" src="${f.mini||f.full}">`:`<span class="av" style="display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)">${esc((l.nom||"?").trim().slice(0,1).toUpperCase())}</span>`};
function dossierBadge(l){const e=dossierEtat(l);return e.ok?(e.bientot.length?badge("Échéance proche","wa"):badge("Dossier complet","ok")):badge("À compléter ("+e.manques.length+")","er")}
function imgResize(file,max,q,lim){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=()=>ko(new Error("Lecture du fichier impossible"));r.onload=()=>{const im=new Image();im.onerror=()=>ko(new Error("Ce fichier n'est pas une image lisible"));
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  let out=c.toDataURL("image/jpeg",q),qq=q;while(out.length>lim&&qq>.3){qq-=.1;out=c.toDataURL("image/jpeg",qq)}out.length>lim?ko(new Error("Image trop lourde")):ok(out)};im.src=r.result};r.readAsDataURL(file)})}
function slotHTML(k,t,img){return`<div class="slot" data-slot="${k}"><b>${t}</b><div class="ph ${img?"hide":""}">Aucune image</div><img alt="" class="${img?"":"hide"}" src="${img||""}"><div class="flex" style="justify-content:center;gap:6px"><label class="btn sm ghost" style="margin:0;cursor:pointer">📷 ${img?"Remplacer":"Ajouter"}<input type="file" accept="image/*" ${k==="photo"?'capture="user"':'capture="environment"'} data-img="${k}" style="display:none"></label><button type="button" class="btn sm ghost ${img?"":"hide"}" data-act="dosDel" data-id="${k}">Retirer</button></div></div>`}
function slotSet(k,img){const el=document.querySelector(`[data-slot="${k}"]`);if(!el)return;el.outerHTML=slotHTML(k,FKINDS.find(x=>x[0]===k)[1],img)}
async function dossierForm(l){
 const d=l.dossier||{};ui.dos={};
 const prev=FKINDS.map(([k])=>[k,l.fichiers&&l.fichiers[k]]);
 prev.forEach(([k,f])=>{if(f)ui.dos[k]={full:f.full||null,mini:f.mini||null,keep:true}});
 const e=dossierEtat(l);
 modal("Dossier d'identité — "+l.nom,`<div class="al ${e.ok?"":"warn"} sm">${e.ok?"✔ Dossier complet.":"À compléter : "+e.manques.map(esc).join(" · ")}${e.bientot.length?"<br>⏰ Échéance dans moins de 30 jours : "+e.bientot.join(", ")+".":""}</div>
 <div class="sm mu" style="margin:6px 0">🔒 Données personnelles sensibles : visibles uniquement par l'administrateur et le superviseur, chaque modification est journalisée. Ne les partagez pas par messagerie.</div>
 <div class="sec">Photos et pièces</div><div class="g2">${FKINDS.map(([k,t])=>slotHTML(k,t,prev.find(x=>x[0]===k)[1]&&(prev.find(x=>x[0]===k)[1].full||prev.find(x=>x[0]===k)[1].mini))).join("")}</div>
 <div class="sec">Pièce d'identité</div><div class="g3"><label>Type<select name="piece_type"><option value="">—</option>${opts(Object.entries(PIECES).map(([v,t])=>({v,t})),d.piece_type||"")}</select></label><label>Numéro<input name="piece_numero" value="${esc(d.piece_numero||"")}"></label><label>Date d'expiration<input type="date" name="piece_expire" value="${d.piece_expire||""}"></label></div>
 <div class="sec">Permis de conduire (moto)</div><div class="g3"><label>Numéro<input name="permis_numero" value="${esc(d.permis_numero||"")}"></label><label>Catégorie<input name="permis_categorie" placeholder="A, A1…" value="${esc(d.permis_categorie||"")}"></label><label>Date d'expiration<input type="date" name="permis_expire" value="${d.permis_expire||""}"></label></div>
 <div class="sec">État civil et contacts</div><div class="g2"><label>Date de naissance<input type="date" name="date_naissance" value="${d.date_naissance||""}"></label><label>Adresse du domicile<input name="adresse" value="${esc(d.adresse||"")}"></label></div>
 <div class="g2"><label>Personne à prévenir (nom)<input name="contact_urgence_nom" value="${esc(d.contact_urgence_nom||"")}"></label><label>Téléphone<input name="contact_urgence_tel" value="${esc(d.contact_urgence_tel||"")}"></label></div>
 <div class="g2"><label>Garant (nom)<input name="garant_nom" value="${esc(d.garant_nom||"")}"></label><label>Téléphone du garant<input name="garant_tel" value="${esc(d.garant_tel||"")}"></label></div>
 <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:10px"><input type="checkbox" name="consent" style="width:auto;margin-top:3px" ${d.consent_le?"checked":""}> Le livreur a été informé et accepte que ses documents soient conservés par ANGEL'S GROUP pour la gestion des livraisons${d.consent_le?` <span class="mu">(accord du ${fdt(d.consent_le)})</span>`:""}.</label>`,
 {wide:true,label:"Enregistrer le dossier",onSubmit:x=>{
  const dd={date_naissance:x.date_naissance||null,adresse:x.adresse||null,contact_urgence_nom:x.contact_urgence_nom||null,contact_urgence_tel:x.contact_urgence_tel||null,garant_nom:x.garant_nom||null,garant_tel:x.garant_tel||null,piece_type:x.piece_type||null,piece_numero:x.piece_numero||null,piece_expire:x.piece_expire||null,permis_numero:x.permis_numero||null,permis_categorie:x.permis_categorie||null,permis_expire:x.permis_expire||null,consent_le:x.consent?(d.consent_le||new Date().toISOString()):null};
  if(CL.on)return CL.dossierSave(l,dd,ui.dos);
  l.dossier=dd;l.fichiers={};Object.entries(ui.dos).forEach(([k,f])=>{if(f)l.fichiers[k]={full:f.full,mini:f.mini}});l.dossier.maj_le=now();
  audit("Dossier livreur modifié",l.nom);save();render();toast("Dossier enregistré","ok")}});
 if(CL.on&&l.fichiers&&Object.keys(l.fichiers).length){CL.dossierLoad(l).then(()=>{FKINDS.forEach(([k])=>{const f=l.fichiers[k];if(f&&f.full&&ui.dos[k]&&ui.dos[k].keep){ui.dos[k].full=f.full;slotSet(k,f.full)}})}).catch(err=>toast(fixErr(err),"err"))}}
document.addEventListener("change",async e=>{const k=e.target.dataset&&e.target.dataset.img;if(!k||!e.target.files[0])return;
 try{const full=await imgResize(e.target.files[0],k==="photo"?640:1280,.78,360000),mini=k==="photo"?await imgResize(e.target.files[0],96,.7,15000):null;ui.dos[k]={full,mini,keep:false};slotSet(k,full)}catch(err){toast(err.message,"err")}});
function livForm(l){const u=l&&usr(l.user_id),r=(l&&l.remu)||S.config.remu;
 modal(l?"Modifier le livreur":"Nouveau livreur",`<div class="g2"><label>Nom et prénoms<input name="nom" required value="${esc(l?l.nom:"")}"></label><label>Téléphone<input name="tel" required value="${esc(l?l.tel:"")}"></label></div>
 <div class="g2"><label>Zone habituelle<select name="zone">${opts(S.config.zones.map(z=>z.nom),l?l.zone:"")}</select></label><label>Moto<select name="moto"><option value="">— aucune —</option>${opts(S.motos.map(m=>({v:m.id,t:m.immat+" ("+m.statut+")"})),l?l.moto_id:"")}</select></label></div>
 <div class="sec">Rémunération</div><div class="g3"><label>Modèle<select name="rtype">${opts([{v:"fixe",t:"Fixe par course"},{v:"pct",t:"% des frais"},{v:"mixte",t:"Mixte"}],r.type)}</select></label><label>Montant fixe<input type="number" name="rfixe" min="0" value="${r.fixe}"></label><label>% des frais<input type="number" name="rpct" min="0" max="100" value="${r.pct}"></label></div>
 ${l?"":`${CL.on?'<label>Identifiant de connexion (par défaut : téléphone)<input name="ident" autocapitalize="none"></label>':""}<label>Code PIN de connexion (min. ${PINMIN} chiffres)<input name="pin" inputmode="numeric" pattern="[0-9]{${PINMIN},8}" required></label>`}
 ${l?`<label>Nouveau PIN (laisser vide pour conserver)<input name="pin" inputmode="numeric" pattern="[0-9]{${PINMIN},8}"></label><label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="actif" style="width:auto" ${u&&u.actif?"checked":""}> Compte actif</label>`:""}`,
 {onSubmit:d=>{const remu={type:d.rtype,fixe:+d.rfixe||0,pct:+d.rpct||0};if(CL.on)return CL.livSave(l,d,remu);
  if(l){Object.assign(l,{nom:d.nom,tel:d.tel,zone:d.zone,moto_id:d.moto||null,remu});u.nom=d.nom;u.actif=!!d.actif;if(d.pin)u.pin_h=hashPin(u.id,d.pin);audit("Modification livreur",d.nom+(u.actif?"":" (compte désactivé)"))}
  else{const nu={id:uid("u"),nom:d.nom,role:"livreur",actif:true};nu.pin_h=hashPin(nu.id,d.pin);S.users.push(nu);S.livreurs.push({id:uid("lv"),user_id:nu.id,nom:d.nom,tel:d.tel,zone:d.zone,moto_id:d.moto||null,statut:"disponible",gps_consent:false,remu});audit("Création livreur",d.nom)}
  save();render()}})}
function motoForm(m){modal(m?"Modifier la moto":"Nouvelle moto",`<div class="g2"><label>Immatriculation<input name="immat" required value="${esc(m?m.immat:"")}"></label><label>Marque / modèle<input name="modele" value="${esc(m?m.modele:"")}"></label></div><div class="g3"><label>Kilométrage<input type="number" name="km" min="0" value="${m?m.km:0}"></label><label>Prochain entretien (km)<input type="number" name="pk" min="0" value="${m?m.prochain_km:1000}"></label><label>Statut<select name="statut">${opts(["disponible","affectee","panne","immobilisee"],m?m.statut:"disponible")}</select></label></div>`,
 {onSubmit:d=>{const v={immat:d.immat,modele:d.modele,km:+d.km,prochain_km:+d.pk,statut:d.statut};if(CL.on)return CL.motoSave(m,v);if(m){Object.assign(m,v);audit("Modification moto",m.immat+" → "+m.statut)}else{S.motos.push(Object.assign({id:uid("m")},v));audit("Création moto",d.immat)}save();render()}})}

/* ---------- Finance ---------- */
VIEWS.finance=()=>{
 const t=ui.fin||"enc";
 const T=tabs("fin",[["enc","Encaissements & reversements"],["ecarts","Écarts"],["comm","Commissions"],["dep","Dépenses"],["ven","Vendeurs"],["renta","Rentabilité"]]);
 let body="";
 if(t==="enc"){
  const rows=S.livreurs.map(l=>{const att=S.livraisons.filter(x=>x.livreur_id===l.id&&isActive(x)).reduce((a,x)=>a+x.montant_attendu,0),s=soldeLiv(l.id);
   return`<tr><td><b>${esc(l.nom)}</b></td><td>${fcfa(att)}</td><td>${fcfa(encaisseLiv(l.id)-encaisseMomo(l.id))}</td><td>${fcfa(encaisseMomo(l.id))}${encaisseDirect(l.id)?`<br><span class="sm mu">+ ${fcfa(encaisseDirect(l.id))} payé direct sur le compte ANGEL'S (non détenu)</span>`:""}</td><td>${fcfa(reverseLiv(l.id))}</td><td><b style="color:${s>0?"var(--er)":"var(--ok)"}">${fcfa(s)}</b>${versEnAttente(l.id)?`<br><span class="sm mu">⏳ ${fcfa(versEnAttente(l.id))} déclaré en Mobile Money</span>`:""}</td><td>${can("admin","caissier")&&s>0?`<button class="btn sm" data-act="reverser" data-id="${l.id}">Enregistrer un reversement</button>`:""}</td></tr>`});
  body=`${versPending()}${tbl(["Livreur","Attendu (courses actives)","Encaissé en espèces","Encaissé en Mobile Money","Reversé (validé)","Restant à reverser",""],rows)}<p class="mu sm">Un montant n'est considéré comme reversé que lorsqu'un caissier ou un administrateur l'enregistre : la déclaration du livreur ne suffit jamais. Au comptant : le caissier enregistre les espèces remises. Par Mobile Money : le livreur déclare le virement avec sa référence, le caissier vérifie la réception puis valide.</p><div class="flex noprint" style="margin:8px 0"><button class="btn ghost" data-act="momoCsv">⬇ Paiements Mobile Money (CSV)</button></div>
  <h2>Journal des mouvements de fonds</h2>${tbl(["Date","Type","Livreur","Commande","Montant","Mode","Référence","Validé / saisi par"],S.fonds.slice(-40).reverse().map(f=>`<tr><td>${fdt(f.ts)}</td><td>${badge({acompte:"Acompte",encaissement:"Encaissement",reversement:"Reversement"}[f.type],f.type==="reversement"?"ok":"")}</td><td>${f.livreur_id?esc(liv(f.livreur_id).nom):"—"}</td><td>${f.commande_id?cmd(f.commande_id).numero:"—"}</td><td><b>${fcfa(f.montant)}</b></td><td>${esc(f.mode||"")}</td><td class="sm">${esc(f.ref||"")}${f.direct?" <span class='mu'>(direct ANGEL'S)</span>":""}</td><td>${esc(f.par)}</td></tr>`))}`}
 if(t==="ecarts")body=ecartsTable(S.livraisons.filter(l=>l.ecart_statut==="a_valider"))+`<h2>Écarts traités</h2>`+tbl(["Commande","Livreur","Écart","Décision","Par"],S.livraisons.filter(l=>l.ecart_statut&&l.ecart_statut!=="a_valider").map(l=>`<tr><td>${cmd(l.commande_id).numero}</td><td>${esc(liv(l.livreur_id).nom)}</td><td>${fcfa(l.ecart)}</td><td>${l.ecart_statut==="valide"?badge("Accepté","ok"):badge("Rejeté","er")} <span class="sm">${esc(l.ecart_decision||"")}</span></td><td>${esc(l.ecart_par||"")}</td></tr>`),"Aucun");
 if(t==="comm")body=tbl(["Livreur","Livraisons réussies","Commission acquise","Payé / avances","Reste à payer",""],S.livreurs.map(l=>{const a=commAcquise(l.id),p=commPayee(l.id);return`<tr><td><b>${esc(l.nom)}</b></td><td>${S.livraisons.filter(x=>x.livreur_id===l.id&&x.statut==="livree").length}</td><td>${fcfa(a)}</td><td>${fcfa(p)}</td><td><b>${fcfa(a-p)}</b></td><td>${can("admin","caissier")?`<button class="btn sm" data-act="payer" data-id="${l.id}">Payer / avance</button>`:""}</td></tr>`}))+`<p class="mu sm">Règles configurables par livreur (fixe, % des frais ou mixte). Les retenues éventuelles doivent être définies selon les règles contractuelles et légales applicables.</p>`;

let watchId=null,lastSent=0;
function syncGPS(){
 const lv=ME&&livreurOf(ME);const need=lv&&lv.gps_consent&&S.livraisons.some(l=>l.livreur_id===lv.id&&l.statut==="en_cours");
 if(need&&watchId==null&&navigator.geolocation){watchId=navigator.geolocation.watchPosition(pushPos,e=>{ui.gpsErr=e.message},{enableHighAccuracy:true,maximumAge:10000,timeout:30000})}
 if(!need&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function pushPos(p,force){
 const lv=ME&&livreurOf(ME);if(!lv)return;const t=Date.now();if(!force&&t-lastSent<S.config.gps_interval*1000)return;lastSent=t;
 const l=S.livraisons.find(x=>x.livreur_id===lv.id&&x.statut==="en_cours");
 const pt={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),ts:now(),livraison_id:l?l.id:null};
if(CL.on){S.pos[lv.id]=pt;CL.pos[lv.id]=pt;return CL.rpc("enregistrer_position",{p_lat:pt.lat,p_lng:pt.lng,p_acc:pt.acc}).catch(()=>{})}
 S.pos[lv.id]=pt;S.gps_hist.push(Object.assign({livreur_id:lv.id},pt));if(S.gps_hist.length>3000)S.gps_hist.splice(0,500);save()}

 const dest=a.gps?`${a.gps.lat},${a.gps.lng}`:encodeURIComponent([a.quartier,a.zone,"Abidjan"].filter(Boolean).join(", "));
 let btn="";

 o=o||{};const cl=cli(c.client_id),v=c.vendeur_id?vendOf(c.vendeur_id):null;
 const d={id:uid("d"),type,numero:null,ts:now(),commande_id:c.id,cmd_numero:c.numero,par:who()};
 if(type==="facture"){
  if(v){d.client={nom:v.nom,tel:v.tel};d.lignes=[{desig:"Frais de livraison — "+c.adr.zone+" ("+c.numero+")",qte:1,pu:c.frais}];d.remise=0;d.total=c.frais;d.paye=0;d.note="Facture du service de livraison, établie au nom du vendeur partenaire. Les articles sont facturés par le vendeur."}
  else{d.client={nom:cl.nom,tel:cl.tel};d.lignes=c.lignes.map(l=>({desig:lname(l),qte:l.qte,pu:l.pu})).concat(c.frais?[{desig:"Frais de livraison — "+c.adr.zone,qte:1,pu:c.frais}]:[]);d.remise=c.remise;d.total=c.total;d.paye=paye(c)}

 else if(type==="recu"){

/* ---- signature électronique (canvas) ---- */
const sigReq=c=>S.config.signature_seuil>0&&c.total>=S.config.signature_seuil;
function initSig(){
 const cv=$("#sig");if(!cv)return;const cx=cv.getContext("2d"),val=$("#sig_val");let dr=false,any=false;
 cx.lineWidth=3;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#111";
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y+.1);cx.stroke()};
 cv.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke();any=true};
 const end=()=>{if(!dr)return;dr=false;any=true;val.value=cv.toDataURL("image/png")};
 cv.onpointerup=end;cv.onpointercancel=end;
 $("#sig_clr").onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);val.value="";any=false};
 const on=$("#sig_on");if(on)on.onchange=()=>$("#sig_box").classList.toggle("hide",!on.checked)}

const QR_PRE="AGE1",TOK_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newTok=()=>{const a=new Uint8Array(5);crypto.getRandomValues(a);return[...a].map(x=>TOK_CH[x%TOK_CH.length]).join("")};
const colisReq=c=>!!(S.config.etiq_scan&&c.colis&&c.colis.length);
const colisPayload=(c,k)=>`${QR_PRE}|${c.numero}|${k.n}/${c.colis.length}|${k.tok}`;
function qrSvg(txt){const q=qrcode(0,"M");q.addData(txt);q.make();return q.createSvgTag({scalable:true,margin:0})}
/* Un QR (ou le code court de 5 caractères imprimé dessous) doit correspondre à un colis de CETTE commande. */
function checkColis(txt,c){
 txt=String(txt||"").trim();let m=txt.match(/^AGE1\|([^|]+)\|(\d+)\/(\d+)\|([A-Z0-9]{5})$/);
 if(m){if(m[1]!==c.numero)return{ok:false,msg:"Ce colis appartient à la commande "+m[1]+", pas à "+c.numero};
  const k=(c.colis||[]).find(x=>x.n===+m[2]&&x.tok===m[4]);return k?{ok:true,n:k.n,mode:"scan"}:{ok:false,msg:"Étiquette invalide ou périmée pour "+c.numero}}
 if(/^[A-Za-z0-9]{5}$/.test(txt)){const k=(c.colis||[]).find(x=>x.tok===txt.toUpperCase());return k?{ok:true,n:k.n,mode:"saisie"}:{ok:false,msg:"Code inconnu pour cette commande"}}
 return{ok:false,msg:"QR non reconnu (étiquette "+S.config.org+" attendue)"}}
function etiqueter(c,nb){
 nb=Math.max(1,Math.min(20,Math.round(+nb||1)));
 if(c.colis&&c.colis.length&&c.colis.length!==nb){
  if(S.livraisons.some(l=>l.commande_id===c.id&&(l.colis_scans||l.colis_liv))){toast("Des colis ont déjà été scannés : le nombre ne peut plus changer","err");return null}
  c.colis=[]}
 if(!c.colis||!c.colis.length)c.colis=Array.from({length:nb},(_,i)=>({n:i+1,tok:newTok()}));
 c.etiq_print=(c.etiq_print||[]).concat({ts:now(),par:who(),nb});audit("Étiquettes colis imprimées",`${c.numero} — ${nb} colis`);return c.colis}

 return`<!doctype html><html><head><meta charset="utf-8"><style>@page{size:100mm 150mm;margin:0}*{box-sizing:border-box}body{margin:0;font:12px system-ui,Arial,sans-serif;color:#000;background:#eee}

/* ---- scan caméra (BarcodeDetector si disponible, sinon jsQR embarqué) ---- */
function stopScan(){if(typeof ui==="undefined")return;if(ui.stream){ui.stream.getTracks().forEach(t=>t.stop());ui.stream=null}if(ui.raf){cancelAnimationFrame(ui.raf);ui.raf=0}}
function startScan(el,onCode){
 stopScan();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){el.innerHTML='<div class="al warn sm" style="margin:0">Caméra indisponible sur cette page (elle exige une adresse sécurisée https). Saisissez le code imprimé sous le QR.</div>';return}
 el.innerHTML='<video playsinline muted style="width:100%;border-radius:8px;background:#000;max-height:260px"></video><canvas class="hide"></canvas>';
 const v=el.querySelector("video"),cv=el.querySelector("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
 const bd="BarcodeDetector" in window?new BarcodeDetector({formats:["qr_code"]}):null;
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(st=>{
  ui.stream=st;v.srcObject=st;v.play().catch(()=>{});let last="",lt=0,busy=false;
  const tick=async()=>{if(!ui.stream)return;
   if(v.readyState>=2&&!busy){busy=true;let txt=null;
    try{if(bd){const r=await bd.detect(v);if(r[0])txt=r[0].rawValue}
     if(!txt&&window.jsQR){const sc=Math.min(1,640/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);cx.drawImage(v,0,0,cv.width,cv.height);const im=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(im.data,im.width,im.height,{inversionAttempts:"dontInvert"});if(r)txt=r.data}}catch(e){}
    busy=false;if(txt&&(txt!==last||Date.now()-lt>2500)){last=txt;lt=Date.now();onCode(txt)}}
   ui.raf=requestAnimationFrame(tick)};tick()
 }).catch(e=>{el.innerHTML='<div class="al warn sm" style="margin:0">Caméra refusée ou absente ('+esc(e.message||e.name)+'). Saisissez le code imprimé sous le QR.</div>'})}

/* ============================================================
   TOURNÉES & MAINTENANCE DES MOTOS
   ============================================================ */
const haversine=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtDur=m=>`${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,"0")}`;
const stopsOf=t=>S.livraisons.filter(l=>l.tournee_id===t.id&&!["reaffectee","refusee","annulee"].includes(l.statut)).sort((a,b)=>a.ordre-b.ordre);
/* Estimation à vol d'oiseau × 1,35, 18 km/h en moyenne et 8 min par arrêt : indicative, sans trafic. */
function estimTournee(t){
 const st=stopsOf(t),pts=st.map(l=>cmd(l.commande_id).adr.gps).filter(Boolean),lp=S.pos[t.livreur_id],path=(lp?[lp]:[]).concat(pts);
 if(path.length<2)return null;let d=0;for(let i=1;i<path.length;i++)d+=haversine(path[i-1],path[i]);d*=1.35;
 return{km:d,min:d/18*60+8*st.length,sans:st.length-pts.length}}
/* Ordre de passage proposé : plus proche voisin depuis la dernière position connue ; les adresses sans GPS passent en dernier, groupées par zone. */
function ordreTournee(cs,start){
 let rest=cs.slice().sort((a,b)=>(a.adr.zone||"").localeCompare(b.adr.zone||"")||new Date(a.date)-new Date(b.date)),out=[],cur=start||null;
 while(rest.length){let best=-1;
  if(cur){let bd=1e9;rest.forEach((c,i)=>{if(c.adr.gps){const d=haversine(cur,c.adr.gps);if(d<bd){bd=d;best=i}}})}else best=rest.findIndex(c=>c.adr.gps);
  if(best<0)best=0;const c=rest.splice(best,1)[0];out.push(c);if(c.adr.gps)cur=c.adr.gps}
 return out}
function creerTournee(lid,cids){
 const lv=liv(lid),cs=cids.map(cmd).filter(Boolean);
 if(!lv||cs.length<2||cs.some(c=>c.statut!=="prete")){toast("Sélectionnez au moins 2 commandes prêtes à livrer","err");return null}
 if(S.config.dossier_obligatoire&&!dossierEtat(lv).ok){toast("Dossier de "+lv.nom+" incomplet ou expiré : tournée impossible","err");return null}
 const mo=lv.moto_id&&moto(lv.moto_id);if(mo&&!["disponible","affectee"].includes(mo.statut)){toast(`Moto ${mo.immat} ${mo.statut} : affectation impossible sans validation`,"err");return null}
 const t={id:uid("t"),numero:"T-"+String(S.tournees.length+1).padStart(4,"0"),livreur_id:lid,ts:now(),par:who()};
 ordreTournee(cs,S.pos[lid]).forEach((c,i)=>{const l=affecter(c,lid,"");if(l){l.tournee_id=t.id;l.ordre=i+1}});
 S.tournees.push(t);audit("Création tournée",`${t.numero} — ${lv.nom} — ${cs.length} livraisons`);return t}

function vendDue(v){
 if(CL.on&&CL.vd[v.id]){const x=CL.vd[v.id];return{acquis:x.acquis,regle:x.regle,restant:x.restant,attente:x.attente,elig:x.elig.map(e=>cmd(e.commande_id)).filter(Boolean),net:c=>(x.elig.find(e=>e.commande_id===c.id)||{}).net||0}}
 const mine=S.commandes.filter(c=>c.vendeur_id===v.id);
 const base=c=>c.montant_produits-c.remise-(c.paye_vendeur||0),net=c=>Math.round(base(c)*(1-(+v.commission_pct||0)/100));
 const elig=mine.filter(c=>c.statut==="livree"&&base(c)>0&&soldeCmd(c)===0);
 const acquis=elig.reduce((a,c)=>a+net(c),0),regle=S.reglements.filter(r=>r.vendeur_id===v.id).reduce((a,r)=>a+r.montant,0);
 const attente=mine.filter(c=>["confirmee","preparation","prete","affectee","en_cours"].includes(c.statut)&&base(c)>0).reduce((a,c)=>a+net(c),0);
 return{acquis,regle,restant:acquis-regle,attente,elig,net}}

 const prods=d.lignes.reduce((a,l)=>a+l.qte*l.pu,0),pv=d.pay==="paye"?prods:d.pay==="partiel"?Math.floor(+d.paye_vendeur||0):0;

/* Import CSV : ref;client;tel;zone;quartier;repere;article;qte;prix */
function parseCSV(t){
 const lines=String(t).split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return{orders:[],err:["Fichier vide"]};
 const cnt=x=>(lines[0].split(x).length-1),sep=[";","\t",","].sort((a,b)=>cnt(b)-cnt(a))[0];
 const cell=x=>x.trim().replace(/^"|"$/g,"").trim();
 let start=0;if(/^(ref|r[eé]f|client|nom)/i.test(cell(lines[0].split(sep)[0])||""))start=1;
 const orders=new Map(),err=[];
 for(let i=start;i<lines.length;i++){const c=lines[i].split(sep).map(cell),n="Ligne "+(i+1)+" : ";
  const [ref,nom,tel,zn,quartier,repere,article,qte,prix,payeV]=c;const z=S.config.zones.find(z=>normTxt(z.nom)===normTxt(zn));
  const q=+String(qte).replace(",","."),pu=+String(prix).replace(/\s/g,"").replace(",",".");
  if(!nom||!tel){err.push(n+"nom et téléphone requis");continue}
  if(!z){err.push(n+"zone inconnue « "+(zn||"")+" » (zones : "+S.config.zones.map(z=>z.nom).join(", ")+")");continue}
  if(!quartier&&!repere){err.push(n+"quartier ou repère requis");continue}
  if(!article){err.push(n+"article manquant");continue}
  if(!(q>0)||!Number.isInteger(q)){err.push(n+"quantité invalide");continue}
  if(!(pu>=0)||isNaN(pu)){err.push(n+"prix invalide");continue}
  const key=ref||"L"+i;let o=orders.get(key);
  if(!o){o={nom,tel,zone:z.nom,quartier:quartier||"",repere:repere||"",ins:"",pay:"livraison",obs:ref?"Réf. vendeur : "+ref:"",lignes:[]};orders.set(key,o)}
  else if(o.tel.replace(/\s/g,"")!==tel.replace(/\s/g,"")){err.push(n+"la référence "+ref+" est utilisée pour deux clients différents");continue}
  if(payeV&&!isNaN(+String(payeV).replace(/\s/g,""))&&+String(payeV).replace(/\s/g,"")>0){o.pay="partiel";o.paye_vendeur=Math.floor(+String(payeV).replace(/\s/g,""))}
  o.lignes.push({desig:article,qte:q,pu})}
 orders.forEach(o=>{if(o.paye_vendeur){const t=o.lignes.reduce((a,l)=>a+l.qte*l.pu,0);if(o.paye_vendeur>t){err.push("Commande "+(o.obs||o.nom)+" : montant payé au vendeur supérieur au prix des articles");}else if(o.paye_vendeur===t)o.pay="paye"}});
 return{orders:[...orders.values()],err}}

/* Affiche une carte dans `el`. o.dest : destination ; o.me : position du livreur ; o.onPick(ll) : repère déplaçable */
function mapInto(el,o){
 const c=o.dest||o.center||{lat:5.345,lng:-4.02};
 return loadLeaflet().then(()=>{
  el.innerHTML="";const m=L.map(el).setView([c.lat,c.lng],o.dest?17:12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
  let mk=null;const put=ll=>{if(mk)mk.setLatLng(ll);else{mk=L.marker(ll,{icon:pinIcon("📍"),draggable:!!o.onPick}).addTo(m);if(o.onPick)mk.on("dragend",()=>o.onPick(mk.getLatLng()))}};
  if(o.dest)put([o.dest.lat,o.dest.lng]);
  if(o.me){L.marker([o.me.lat,o.me.lng],{icon:pinIcon("🏍️")}).addTo(m);if(o.dest)m.fitBounds([[o.dest.lat,o.dest.lng],[o.me.lat,o.me.lng]],{padding:[35,35],maxZoom:17})}
  if(o.onPick)m.on("click",e=>{put(e.latlng);o.onPick(e.latlng)});
  setTimeout(()=>m.invalidateSize(),150);return{map:m,put}})
 .catch(()=>{el.style.height="auto";el.innerHTML=`<div class="al warn sm" style="margin:0">Carte indisponible (pas de connexion Internet).${o.dest?` Coordonnées : ${o.dest.lat}, ${o.dest.lng} — <a target="_blank" rel="noopener" href="${osmLink(o.dest.lat,o.dest.lng)}">ouvrir</a>`:""}</div>`;return null})}

 try{if(CL.on){const t=await CL.rpc("creer_lien_commande",{p_renouveler:!!renew});link=location.href.split("#")[0].split("?")[0]+"#commande="+t}else link=location.href.split("#")[0].split("?")[0]+"#commande="+v.id}catch(e){return toast(fixErr(e),"err")}
 const msg=`Bonjour ! Passez votre commande chez ${v.nom} en ligne (articles, captures, quantités, position de livraison) : ${link}`;
 modal("Lien de commande de vos clients",`<p class="sm mu">Partagez ce lien ou ce QR code (WhatsApp, statut, boutique). Vos clients y décrivent leur commande : articles, captures d'écran, quantités, prix s'ils le connaissent, et leur position de livraison. Rien n'est livré avant votre validation.</p>
 <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:150px;height:150px;background:#fff;padding:6px;border-radius:8px">${qrSvg(link)}</div><div style="flex:1;min-width:200px"><label>Lien<input readonly value="${esc(link)}" onfocus="this.select()"></label></div></div>
 <div class="flex" style="margin-top:10px"><button type="button" class="btn" data-act="cpTxt" data-id="${esc(link)}">📋 Copier le lien</button><a class="btn ok" target="_blank" rel="noopener" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(msg)}">💬 Partager sur WhatsApp</a>${CL.on?'<button type="button" class="btn ghost er" data-act="cmdLienNew">Renouveler (l\'ancien lien cessera de fonctionner)</button>':""}</div>`,{label:"Fermer",onSubmit:()=>true,focus:false})}
/* Page publique */
function renderOrder(p,submit){
 document.title=p.vendeur+" — Commander";
 const st={lines:[{desig:"",qte:1,pu:"",img:-1}],photos:[],gps:null},app=$("#app"),gp=p.w&&String(p.w).replace(/\D/g,"");
 const sync=()=>{[...app.querySelectorAll(".ol")].forEach((r,i)=>{if(!st.lines[i])return;st.lines[i].desig=r.querySelector(".o_d").value;st.lines[i].qte=Math.max(1,parseInt(r.querySelector(".o_q").value)||1);st.lines[i].pu=r.querySelector(".o_p").value})};
 const lines=()=>st.lines.map((l,i)=>`<div class="ol" style="border:1px solid var(--line,#d8dee6);border-radius:10px;padding:8px;margin-bottom:8px"><div style="display:flex;gap:6px"><input class="o_d" placeholder="Article (ex. sac à main noir)" value="${esc(l.desig)}" style="flex:1"><button type="button" class="btn sm ghost er" data-o="del" data-i="${i}" ${st.lines.length<2?"disabled":""}>✕</button></div>
  <div style="display:flex;gap:6px;margin-top:6px"><label style="flex:1">Quantité<input class="o_q" type="number" min="1" max="9999" value="${l.qte}"></label><label style="flex:1">Prix unitaire (F) <span class="mu sm">si vous le connaissez</span><input class="o_p" type="number" min="0" inputmode="numeric" value="${esc(l.pu)}"></label></div>
  <div style="margin-top:6px">${l.img>=0&&st.photos[l.img]?`<img alt="" src="${st.photos[l.img]}" style="height:56px;border-radius:6px;vertical-align:middle"> <button type="button" class="btn sm ghost" data-o="unph" data-i="${i}">Retirer la capture</button>`:`<label class="btn sm ghost" style="display:inline-block;cursor:pointer">📷 Ajouter la capture d'écran / photo<input type="file" accept="image/*" data-o="ph" data-i="${i}" hidden></label>`}</div></div>`).join("");
 const draw=()=>{app.innerHTML=`<div class="login"><div class="card" style="max-width:560px;width:100%">
  <div style="font-size:13px;letter-spacing:1px;color:var(--b2);font-weight:700">${esc(p.org)}</div><h2 style="margin:2px 0 4px">Commander chez ${esc(p.vendeur)}</h2>
  <div class="mu sm" style="margin-bottom:12px">Décrivez ce que vous voulez : ${esc(p.vendeur)} confirme votre commande et la fait livrer à moto par ${esc(p.org)}.</div>
  <h3 style="margin:8px 0">1. Vos articles</h3><div id="o_lines">${lines()}</div><button type="button" class="btn ghost" data-o="add" ${st.lines.length>=30?"disabled":""}>+ Ajouter un article</button>
  <h3 style="margin:14px 0 8px">2. Vous</h3><div class="g2"><label>Votre nom<input id="o_nom" maxlength="80" autocomplete="name"></label><label>Téléphone / WhatsApp<input id="o_tel" inputmode="tel" autocomplete="tel" placeholder="07 07 00 00 00"></label></div>
  <h3 style="margin:14px 0 8px">3. Où livrer ?</h3><div class="g2"><label>Zone<select id="o_zone"><option value="">— choisir —</option>${p.zones.map(z=>`<option>${esc(z.nom)}</option>`).join("")}</select></label><label>Quartier<input id="o_q" maxlength="120"></label></div>
  <label>Point de repère (pharmacie, école, couleur du portail…)<input id="o_rep" maxlength="200"></label>
  <div style="margin:8px 0"><button type="button" class="btn" data-o="gps">📍 Utiliser ma position actuelle</button> <span id="o_gps" class="sm">${st.gps?`✔ Position enregistrée (±${st.gps.acc} m) · <a href="#" data-o="nogps">effacer</a>`:'<span class="mu">Recommandé : le livreur trouvera votre adresse plus facilement.</span>'}</span></div>
  <label>Message pour le vendeur (facultatif)<textarea id="o_note" rows="2" maxlength="500"></textarea></label>
  <div id="o_err" class="al warn sm" style="display:none;margin-top:8px"></div>
  <button type="button" class="btn" id="o_send" style="width:100%;margin-top:12px">Envoyer ma commande</button>
  <div class="mu sm" style="margin-top:8px">Votre demande n'est pas encore une commande : ${esc(p.vendeur)} vérifie les articles et les prix, puis vous contacte pour confirmer.</div></div></div>`;
  app.querySelectorAll("[data-o]").forEach(b=>{const a=b.dataset.o,i=+b.dataset.i;
   if(a==="ph")b.onchange=async()=>{const f=b.files[0];if(!f)return;sync();try{if(st.photos.length>=6)throw new Error("Maximum 6 photos");st.photos.push(await imgResize(f,900,.72,250000));st.lines[i].img=st.photos.length-1;keep()}catch(e){toast(e.message,"err")}};
   else b.onclick=ev=>{ev.preventDefault();sync();
    if(a==="add"){st.lines.push({desig:"",qte:1,pu:"",img:-1});keep()}
    else if(a==="del"){st.lines.splice(i,1);keep()}
    else if(a==="unph"){st.lines[i].img=-1;keep()}
    else if(a==="nogps"){st.gps=null;keep()}
    else if(a==="gps"){if(!navigator.geolocation)return toast("Géolocalisation indisponible : indiquez votre quartier et un repère","err");
     navigator.geolocation.getCurrentPosition(g=>{st.gps={lat:+g.coords.latitude.toFixed(6),lng:+g.coords.longitude.toFixed(6),acc:Math.round(g.coords.accuracy||0)};keep()},e=>toast("Position impossible : autorisez la localisation ou indiquez votre quartier ("+e.message+")","err"),{enableHighAccuracy:true,timeout:20000})}}});
  $("#o_send").onclick=send};
 const FIELDS=["o_nom","o_tel","o_zone","o_q","o_rep","o_note"],keep=()=>{const v={};FIELDS.forEach(k=>{const e=document.getElementById(k);if(e)v[k]=e.value});draw();FIELDS.forEach(k=>{const e=document.getElementById(k);if(e&&v[k]!=null)e.value=v[k]})};
 async function send(){sync();const err=m=>{const e=$("#o_err");e.textContent=m;e.style.display="block";e.scrollIntoView({block:"center"})};
  const val=k=>$("#"+k).value.trim(),L=st.lines.filter(l=>l.desig.trim());
  if(!L.length)return err("Ajoutez au moins un article");if(!val("o_nom"))return err("Indiquez votre nom");if(val("o_tel").replace(/\D/g,"").length<8)return err("Indiquez un numéro de téléphone valide");
  if(!val("o_zone"))return err("Choisissez votre zone de livraison");if(!val("o_q")&&!val("o_rep")&&!st.gps)return err("Indiquez votre quartier, un point de repère ou envoyez votre position");
  const used=[...new Set(L.map(l=>l.img).filter(i=>i>=0))],photos=used.map(i=>st.photos[i]);
  const pl={nom:val("o_nom"),tel:val("o_tel"),zone:val("o_zone"),quartier:val("o_q"),repere:val("o_rep"),lat:st.gps?st.gps.lat:null,lng:st.gps?st.gps.lng:null,note:val("o_note")||null,photos,
   lignes:L.map(l=>({desig:l.desig.trim(),qte:l.qte,pu:l.pu===""||isNaN(+l.pu)?null:Math.round(+l.pu),img:l.img>=0?used.indexOf(l.img):null}))};
  const b=$("#o_send");b.disabled=true;
  try{const r=await submit(pl);app.innerHTML=`<div class="login"><div class="card" style="text-align:center;max-width:460px"><div style="font-size:42px">✅</div><h2>Commande envoyée</h2><p>Référence <b style="font-size:20px;letter-spacing:2px">${esc(r.ref)}</b></p><p class="mu">${esc(p.vendeur)} va vérifier votre commande et vous contacter pour confirmer les prix et la livraison.</p>${gp?`<a class="btn ok" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${gp.length===10?"225"+gp:gp}?text=${encodeURIComponent("Bonjour, je viens d'envoyer une commande chez "+p.vendeur+" (réf. "+r.ref+")")}">💬 Contacter ${esc(p.org)}</a>`:""}</div></div>`}
  catch(e){b.disabled=false;err(fixErr(e))}}
 draw()}
async function bootOrderCloud(token){
 try{await CL.init();const p=await CL.rpc("commande_lien_get",{p_token:token});if(!p)throw new Error("Lien expiré ou invalide : demandez-en un nouveau à votre fournisseur.");
  renderOrder(p,pl=>CL.rpc("demande_deposer",{p_token:token,p:pl}))}
 catch(e){$("#app").innerHTML='<div class="login"><div class="card">'+esc(fixErr(e))+'</div></div>'}}
function bootOrderLocal(vid){
 let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const v=d&&d.v===1&&(d.vendeurs||[]).find(x=>x.id===vid);if(!v){$("#app").innerHTML='<div class="login"><div class="card">Lien indisponible : ouvrez-le sur l\'appareil de démonstration.</div></div>';return}
 renderOrder({org:d.config.org,w:d.config.whatsapp,vendeur:v.nom,zones:d.config.zones.map(z=>({nom:z.nom,frais:z.frais}))},async pl=>{
  const live=JSON.parse(localStorage.getItem(KEY));live.demandes=live.demandes||[];
  if(live.demandes.filter(x=>x.vendeur_id===vid&&x.tel===pl.tel.replace(/[^0-9+]/g,"")&&Date.now()-new Date(x.cree_le)<36e5).length>=5)throw new Error("Trop de demandes envoyées : réessayez plus tard");
  const id="dm"+Math.random().toString(36).slice(2,10);live.demandes.push({id,vendeur_id:vid,nom:pl.nom,tel:pl.tel.replace(/[^0-9+]/g,""),zone:pl.zone,quartier:pl.quartier,repere:pl.repere,lat:pl.lat,lng:pl.lng,lignes:pl.lignes,photos:pl.photos,note:pl.note,statut:"nouvelle",cree_le:new Date().toISOString()});
  localStorage.setItem(KEY,JSON.stringify(live));return{ok:true,ref:id.slice(2,8).toUpperCase()}})}

/* ---------- Démarrage ---------- */
const _ptok=(location.hash.match(/^#portail=(.+)$/)||[])[1],_stok=(location.hash.match(/^#suivi=(.+)$/)||[])[1],_ctok=(location.hash.match(/^#commande=(.+)$/)||[])[1];
if(_ctok&&CL.on&&/^[a-f0-9]{64}$/.test(_ctok)){bootOrderCloud(_ctok)}
else if(_ctok&&!CL.on){bootOrderLocal(_ctok)}
else if(_stok&&CL.on&&/^[a-f0-9]{64}$/.test(_stok)){bootSuiviCloud(_stok)}
else if(_stok&&!CL.on){bootSuiviLocal(_stok)}
else if(_ptok&&CL.on&&/^[a-f0-9]{64}$/.test(_ptok)){bootPortalCloud(_ptok)}
else if(location.hash.startsWith("#portail=")){
 try{const p=unb64(location.hash.slice(9));let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=d&&d.v===1?d:null;renderPortal(p)}
 catch(e){$("#app").innerHTML='<div class="login"><div class="card">Lien invalide ou expiré. Demandez-en un nouveau.</div></div>'}
}else if(CL.on){bootCloud()}
else{
 load();
 {const id=sessionStorage.getItem("angels_me");const u=id&&usr(id);if(u&&u.actif)ME=u}
 render();
}
