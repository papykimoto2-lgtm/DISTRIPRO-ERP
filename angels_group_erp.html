<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a3aa8">
<title>ANGEL'S GROUP ERP — Livraisons</title>
<style>
:root{--b:#1a3aa8;--b2:#0f2570;--bg:#f2f4fa;--card:#fff;--tx:#1b2240;--mu:#6b7390;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#dfe3f0;--okbg:#e3f5ea;--wabg:#fff1d6;--erbg:#fde5e5;--bbg:#e5ebfb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.shell{display:flex;min-height:100vh}
aside{width:230px;background:var(--b2);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;font-size:16px;padding:6px 8px 12px;line-height:1.2}
aside .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
aside a{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;color:#dbe2ff;cursor:pointer;text-decoration:none}
aside a:hover{background:rgba(255,255,255,.1)}
aside a.on{background:#fff;color:var(--b2);font-weight:700}
aside .who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:12px}
main{flex:1;padding:18px;min-width:0}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:800}
.kpi .l{color:var(--mu);font-size:12px}
.kpi.w .v{color:var(--wa)}.kpi.e .v{color:var(--er)}.kpi.o .v{color:var(--ok)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);background:#f7f8fd;white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px}
.tw table{margin:0}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--b2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--b)}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn.wa{background:var(--wa)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bbg);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.er{background:var(--erbg);color:var(--er)}.badge.mu{background:#eceef5;color:var(--mu)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu)}.sm{font-size:12px}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
label{display:block;font-size:12px;color:var(--mu);font-weight:600}
label input,label select,label textarea{margin-top:3px;color:var(--tx);font-weight:400;font-size:14px}
.g2{display:grid;gap:10px;grid-template-columns:1fr 1fr}.g3{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
.ov{position:fixed;inset:0;background:rgba(10,20,60,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:14px;width:100%;max-width:520px}.md.wide{max-width:780px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bd)}
.mb{padding:14px 16px;display:grid;gap:10px}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.x{background:none;border:0;font-size:18px;cursor:pointer}
.sec{font-weight:700;margin-top:4px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:6px;width:min(92vw,420px)}
.t{background:#1b2240;color:#fff;padding:10px 14px;border-radius:10px}.t.err{background:var(--er)}.t.ok{background:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.al{padding:8px 12px;border-radius:8px;margin-bottom:6px;background:var(--bbg)}.al.warn{background:var(--wabg)}.al.err{background:var(--erbg)}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;background:var(--b);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
.login{max-width:380px;margin:8vh auto;padding:0 14px}
.login .card{padding:20px}
.lv{max-width:520px;margin:0 auto;padding:12px}
.lvh{background:var(--b2);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.mc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:12px;display:grid;gap:8px}
.mc.urg{border-left:5px solid var(--er)}
.mc .btn{padding:11px 14px}
.mc .row{display:flex;gap:8px;flex-wrap:wrap}.mc .row .btn{flex:1}
.pill{background:#f3f5fb;border-radius:8px;padding:6px 9px}
.amt{font-size:20px;font-weight:800;color:var(--b2)}
@media(max-width:820px){
 .shell{display:block}
 aside{width:auto;height:auto;position:static;display:flex;gap:4px;overflow-x:auto;padding:8px}
 aside .brand,aside .who{display:none}
 aside a{white-space:nowrap}
 main{padding:12px}.g2,.g3{grid-template-columns:1fr}
}
@media print{aside,.noprint{display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<noscript>JavaScript est requis.</noscript>
<script>
"use strict";
/* ============================================================
   ANGEL'S GROUP ERP — V1 Gestion des livraisons à moto
   Application autonome (HTML/CSS/JS). Données : localStorage.
   ============================================================ */
const KEY="angels_erp_v1";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const now=()=>new Date().toISOString();
const fdt=i=>i?new Date(i).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const ago=i=>{if(!i)return"jamais";const m=Math.round((Date.now()-new Date(i))/60000);return m<1?"à l'instant":m<60?`il y a ${m} min`:`il y a ${Math.round(m/60)} h`};
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
let S=null,ME=null,view="dashboard",ui={};

/* ---------- Référentiels ---------- */
const ST={brouillon:"Brouillon",attente:"En attente de confirmation",confirmee:"Confirmée",preparation:"En préparation",prete:"Prête à être livrée",affectee:"Affectée à un livreur",en_cours:"En cours de livraison",livree:"Livrée",echouee:"Livraison échouée",retour_cours:"Retour en cours",retour_recu:"Retour réceptionné",annulee:"Annulée"};
const TRANS={brouillon:["attente","confirmee","annulee"],attente:["confirmee","annulee"],confirmee:["preparation","annulee"],preparation:["prete","annulee"],prete:["affectee","annulee"],affectee:["en_cours","echouee","prete","annulee"],en_cours:["livree","echouee"],livree:[],echouee:["prete","retour_cours","annulee"],retour_cours:["retour_recu"],retour_recu:[],annulee:[]};
const STC={livree:"ok",retour_recu:"ok",echouee:"er",annulee:"mu",brouillon:"mu",retour_cours:"wa",en_cours:"wa",affectee:"wa"};
const LST={affectee:"À accepter",acceptee:"Acceptée",en_cours:"En course",livree:"Livrée",echouee:"Échouée",refusee:"Refusée",reaffectee:"Réaffectée",annulee:"Annulée"};
const LSTC={livree:"ok",echouee:"er",refusee:"er",reaffectee:"mu",annulee:"mu",en_cours:"wa",affectee:"wa"};
const ROLES={admin:"Administrateur",direction:"Direction générale",superviseur:"Superviseur des livraisons",commercial:"Responsable commercial",preparateur:"Préparateur",caissier:"Caissier",livreur:"Livreur",vendeur:"Vendeur partenaire"};
const NAV=[
 {v:"dashboard",l:"Tableau de bord",i:"📊",r:["admin","direction","superviseur"]},
 {v:"commandes",l:"Commandes",i:"🧾",r:["admin","superviseur","commercial","preparateur"]},
 {v:"livraisons",l:"Centre de livraison",i:"🏍️",r:["admin","superviseur"]},
 {v:"clients",l:"Clients",i:"👥",r:["admin","superviseur","commercial"]},
 {v:"produits",l:"Produits & stock",i:"📦",r:["admin","commercial","preparateur"]},
 {v:"livreurs",l:"Livreurs & motos",i:"🛵",r:["admin","superviseur"]},
 {v:"finance",l:"Finance",i:"💰",r:["admin","direction","caissier"]},
 {v:"incidents",l:"Incidents & retours",i:"⚠️",r:["admin","superviseur","preparateur"]},
 {v:"utilisateurs",l:"Utilisateurs",i:"🔐",r:["admin"]},
 {v:"audit",l:"Journal d'audit",i:"📜",r:["admin","direction"]},
 {v:"vendeurs",l:"Vendeurs partenaires",i:"🏪",r:["admin","commercial","superviseur"]},
 {v:"mesCmd",l:"Mes commandes",i:"🛍️",r:["vendeur"]},
 {v:"mesReg",l:"Mes règlements",i:"💳",r:["vendeur"]},
 {v:"params",l:"Paramètres",i:"⚙️",r:["admin"]}
];

/* ---------- Accès aux données ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
const cmd=id=>byId(S.commandes,id),cli=id=>byId(S.clients,id),liv=id=>byId(S.livreurs,id),prod=id=>byId(S.produits,id),moto=id=>byId(S.motos,id),usr=id=>byId(S.users,id);
const lname=l=>l.produit_id?((prod(l.produit_id)||{}).nom||"?"):(l.desig||"Article");
const vend=()=>ME&&S.vendeurs.find(v=>v.user_id===ME.id);
const vendOf=id=>S.vendeurs.find(v=>v.id===id);
const zone=n=>S.config.zones.find(z=>z.nom===n);
const livsOf=cid=>S.livraisons.filter(l=>l.commande_id===cid);
const isActive=l=>["affectee","acceptee","en_cours"].includes(l.statut);
const activeLiv=cid=>livsOf(cid).find(isActive);
const livreurOf=u=>S.livreurs.find(l=>l.user_id===u.id);
const who=()=>ME?ME.nom:"Système";
const can=(...roles)=>ME&&roles.includes(ME.role);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Stockage local plein ou indisponible","err")}}
function audit(action,detail){S.audit.push({ts:now(),user:who(),role:ME?ME.role:"système",action,detail:detail||""});if(S.audit.length>5000)S.audit.splice(0,S.audit.length-5000)}
function toast(m,t){const d=document.createElement("div");d.className="t "+(t||"");d.textContent=m;$("#toast").appendChild(d);setTimeout(()=>d.remove(),t==="err"?5500:3000)}

/* ---------- Calculs ---------- */
function calcCmd(c){c.montant_produits=c.lignes.reduce((a,l)=>a+l.qte*l.pu,0);c.total=Math.max(0,c.montant_produits+(+c.frais||0)-(+c.remise||0));return c}
const paye=c=>S.fonds.filter(f=>f.commande_id===c.id&&(f.type==="acompte"||f.type==="encaissement")).reduce((a,f)=>a+f.montant,0);
const soldeCmd=c=>Math.max(0,c.total-paye(c));
const encaisseLiv=id=>S.fonds.filter(f=>f.livreur_id===id&&f.type==="encaissement").reduce((a,f)=>a+f.montant,0);
const reverseLiv=id=>S.fonds.filter(f=>f.livreur_id===id&&f.type==="reversement").reduce((a,f)=>a+f.montant,0);
const soldeLiv=id=>encaisseLiv(id)-reverseLiv(id);
function commissionLiv(l){const lv=liv(l.livreur_id),r=lv&&lv.remu?lv.remu:S.config.remu,c=cmd(l.commande_id);if(l.statut!=="livree")return 0;
 return (r.type==="pct"?0:+r.fixe||0)+(r.type==="fixe"?0:(+r.pct||0)/100*(c?c.frais:0))}
const commAcquise=id=>S.livraisons.filter(l=>l.livreur_id===id).reduce((a,l)=>a+commissionLiv(l),0);
const commPayee=id=>S.paie.filter(p=>p.livreur_id===id).reduce((a,p)=>a+p.montant,0);
function fraicheur(p){if(!p)return{k:"mu",t:"Aucune position"};const m=(Date.now()-new Date(p.ts))/60000;
 return m<=S.config.gps_stale_ok?{k:"ok",t:"Récente ("+ago(p.ts)+")"}:m<=S.config.gps_stale_warn?{k:"wa",t:"Ancienne ("+ago(p.ts)+")"}:{k:"er",t:"Obsolète ("+ago(p.ts)+") — pas du temps réel"}}
const badge=(txt,k)=>`<span class="badge ${k||""}">${esc(txt)}</span>`;
const sb=c=>badge(ST[c.statut],STC[c.statut]);
const lb=l=>badge(LST[l.statut],LSTC[l.statut]);

/* ---------- Métier : commandes ---------- */
function setStatut(c,to,note){
 if(!TRANS[c.statut].includes(to)){toast(`Transition interdite : ${ST[c.statut]} → ${ST[to]}`,"err");return false}
 c.hist.push({ts:now(),de:c.statut,a:to,par:who(),note:note||""});c.statut=to;return true}
function numCmd(){S.seq.cmd++;return"CMD-"+new Date().getFullYear()+"-"+String(S.seq.cmd).padStart(4,"0")}
function creerCmd(d){
 const c={id:uid("c"),numero:numCmd(),date:now(),vendeur_id:d.vendeur_id||null,vendeur_encaisse:!!d.vendeur_encaisse,client_id:d.client_id,adr:d.adr,lignes:d.lignes,frais:+d.frais||0,remise:+d.remise||0,paiement:d.paiement,mode:d.mode,priorite:d.priorite||"normale",canal:d.canal||"Téléphone",obs:d.obs||"",statut:"brouillon",hist:[{ts:now(),de:null,a:"brouillon",par:who(),note:"Création"}],cree_par:who(),stock_sorti:false};
 calcCmd(c);S.commandes.unshift(c);
 let ac=d.paiement==="avance"?c.total:d.paiement==="partiel"?Math.min(+d.acompte||0,c.total):0;
 if(ac>0)S.fonds.push({id:uid("f"),type:"acompte",commande_id:c.id,montant:ac,mode:d.mode,ts:now(),par:who()});
 audit("Création commande",c.numero+" — "+fcfa(c.total));
 if(d.confirmer)setStatut(c,"confirmee","Confirmation à la création");
 return c}
function stockMvt(p,qte,type,ref){p.stock+=qte;S.stock_mvts.push({id:uid("m"),ts:now(),produit_id:p.id,type,qte,ref,par:who()})}
function marquerPrete(c){
 for(const l of c.lignes){if(!l.produit_id)continue;const p=prod(l.produit_id);if(!p||p.stock<l.qte){toast(`Stock insuffisant : ${p?p.nom:"?"} (${p?p.stock:0} dispo, ${l.qte} requis)`,"err");return false}}
 if(!setStatut(c,"prete","Préparation terminée"))return false;
 c.lignes.forEach(l=>{if(l.produit_id)stockMvt(prod(l.produit_id),-l.qte,"sortie_commande",c.numero)});c.stock_sorti=true;return true}
function annuler(c,motif){
 const act=activeLiv(c.id);
 if(!setStatut(c,"annulee","Annulée : "+motif))return false;
 if(act){act.statut="annulee";act.fin_at=now()}
 if(c.stock_sorti){c.lignes.forEach(l=>{if(l.produit_id)stockMvt(prod(l.produit_id),l.qte,"annulation",c.numero)});c.stock_sorti=false}
 audit("Annulation commande",c.numero+" — "+motif);return true}
function affecter(c,lid,motif){
 const lv=liv(lid),old=activeLiv(c.id);
 if(!lv){toast("Livreur introuvable","err");return false}
 if(c.statut!=="prete"&&!(old&&["affectee","en_cours"].includes(c.statut))){toast("Cette commande ne peut pas être affectée dans son état actuel","err");return false}
 const mo=lv.moto_id&&moto(lv.moto_id);
 if(mo&&mo.statut!=="disponible"&&mo.statut!=="affectee"){toast(`Moto ${mo.immat} ${mo.statut} : affectation impossible sans validation`,"err");return false}
 if(old){old.statut="reaffectee";old.fin_at=now();old.motif=motif;audit("Réaffectation livraison",`${c.numero} : ${liv(old.livreur_id).nom} → ${lv.nom} — ${motif}`)}
 else if(!setStatut(c,"affectee","Affectée à "+lv.nom))return false;
 else audit("Affectation livraison",`${c.numero} → ${lv.nom}`);
 const tent=livsOf(c.id).filter(x=>!["reaffectee","refusee","annulee"].includes(x.statut)).length+1;
 const l={id:uid("l"),commande_id:c.id,livreur_id:lid,moto_id:lv.moto_id||null,tentative:tent,statut:"affectee",code:String(Math.floor(1000+Math.random()*9000)),montant_attendu:soldeCmd(c),affectee_at:now(),hist:[{ts:now(),a:"affectee",par:who()}]};
 S.livraisons.push(l);return l}
function lhist(l,a,extra){l.hist.push(Object.assign({ts:now(),a,par:who()},extra||{}))}

/* ---------- Métier : actions livreur ---------- */
function accepter(l){if(l.statut!=="affectee")return false;l.statut="acceptee";l.accept_at=now();lhist(l,"acceptee");return true}
function refuser(l,motif){if(!["affectee","acceptee"].includes(l.statut))return false;const c=cmd(l.commande_id);l.statut="refusee";l.fin_at=now();l.motif=motif;lhist(l,"refusee",{note:motif});setStatut(c,"prete","Refus du livreur : "+motif);audit("Refus de mission",`${c.numero} — ${liv(l.livreur_id).nom} — ${motif}`);return true}
function priseEnCharge(l,nb){if(l.statut!=="acceptee"||l.collecte_at)return false;l.collecte_at=now();l.nb_colis=nb;lhist(l,"collecte",{note:nb+" colis"});return true}
function demarrer(l){if(l.statut!=="acceptee"||!l.collecte_at)return false;const c=cmd(l.commande_id);if(!setStatut(c,"en_cours","Départ du livreur"))return false;l.statut="en_cours";l.depart_at=now();lhist(l,"en_cours");return true}
function confirmer(l,d){
 if(l.statut!=="en_cours"){toast("Cette livraison n'est plus en cours (déjà validée ?)","err");return false}
 const c=cmd(l.commande_id);
 if(String(d.code).trim()!==l.code){toast("Code de confirmation incorrect","err");return false}
 const m=Math.round(+d.montant||0),att=l.montant_attendu;
 if(att>0&&d.montant==="")return toast("Saisissez le montant encaissé (0 si rien reçu)","err"),false;
 if(m<0)return toast("Montant invalide","err"),false;
 const ecart=m-att;
 if(ecart!==0&&!String(d.ecart_note||"").trim())return toast(`Écart de ${fcfa(ecart)} : explication obligatoire`,"err"),false;
 if(!setStatut(c,"livree","Livrée — reçu par "+d.recu_par))return false;
 l.statut="livree";l.fin_at=now();l.recu_par=d.recu_par;l.obs=d.obs||"";l.montant_encaisse=m;l.mode=d.mode;l.ecart=ecart;
 l.gps_confirm=S.pos[l.livreur_id]?{lat:S.pos[l.livreur_id].lat,lng:S.pos[l.livreur_id].lng,ts:S.pos[l.livreur_id].ts}:null;
 if(ecart!==0){l.ecart_statut="a_valider";l.ecart_note=d.ecart_note}
 if(m>0)S.fonds.push({id:uid("f"),type:"encaissement",livreur_id:l.livreur_id,livraison_id:l.id,commande_id:c.id,montant:m,mode:d.mode,ts:now(),par:who()});
 lhist(l,"livree",{note:`encaissé ${fcfa(m)}`});audit("Confirmation livraison",`${c.numero} — encaissé ${fcfa(m)} / attendu ${fcfa(att)}`);return true}
function echec(l,motif,obs){
 if(!["affectee","acceptee","en_cours"].includes(l.statut)){toast("Livraison déjà clôturée","err");return false}
 const c=cmd(l.commande_id);if(!setStatut(c,"echouee","Échec : "+motif))return false;
 l.statut="echouee";l.fin_at=now();l.motif_echec=motif;l.obs=obs||"";lhist(l,"echouee",{note:motif});audit("Livraison échouée",`${c.numero} — ${motif}`);return true}

/* ---------- Données de démonstration ---------- */
function seed(){
 S={v:1,seq:{cmd:0,inc:0},

 <div class="g2"><label>Client<select name="client" id="f_client"><option value="">— Choisir —</option>${S.clients.map(c=>`<option value="${c.id}">${esc(c.nom)} · ${esc(c.tel)}</option>`).join("")}<option value="__new">➕ Nouveau client</option></select></label>
 <label>Adresse de livraison<select name="adresse" id="f_adr"></select></label></div>
 <div class="g2 hide" id="newcl"><label>Nom du client<input name="n_nom"></label><label>Téléphone<input name="n_tel" inputmode="tel"></label></div>
 <div class="hide" id="newadr"><div class="g3"><label>Zone<select name="a_zone">${opts(S.config.zones.map(z=>z.nom))}</select></label><label>Quartier<input name="a_q"></label><label>Point de repère<input name="a_rep"></label></div><label>Instructions d'accès<input name="a_ins"></label></div>
 <div class="sec">Produits</div><div id="lignes"></div><button type="button" class="btn sm ghost" data-act="addLigne">+ Ajouter un produit</button>
 <div class="g3"><label>Frais de livraison<input type="number" name="frais" id="f_frais" min="0" value="0"></label><label>Remise<input type="number" name="remise" id="f_remise" min="0" value="0"></label><label>Priorité<select name="priorite"><option value="normale">Normale</option><option value="urgente">Urgente</option><option value="programmee">Programmée</option></select></label></div>
 <div class="g3"><label>Paiement<select name="paiement" id="f_pay"><option value="livraison">À la livraison</option><option value="avance">Payé d'avance</option><option value="partiel">Paiement partiel</option></select></label>
 <label>Acompte versé<input type="number" name="acompte" id="f_acompte" min="0" value="0" disabled></label><label>Mode de paiement<select name="mode">${opts(S.config.modes)}</select></label></div>
 <div class="g2"><label>Canal<select name="canal">${opts(["Téléphone","WhatsApp","Vente en ligne","Commande directe","Autre"])}</select></label><label>Observations<input name="obs"></label></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" name="confirmer" checked style="width:auto"> Confirmer immédiatement</label>
 <div class="card" style="margin:0;background:#f7f8fd"><div class="between"><span>Produits : <b id="t_prod">0 F</b></span><span>Total à payer : <b id="t_tot" style="font-size:18px">0 F</b></span></div><div class="between sm mu"><span>Solde à encaisser à la livraison</span><b id="t_solde">0 F</b></div></div>`,
 {wide:true,label:"Créer la commande",onSubmit:(d,f)=>{
  let cl,ad;
  if(d.client==="__new"){if(!d.n_nom.trim()||!d.n_tel.trim())return toast("Nom et téléphone du client requis","err"),false;
   cl={id:uid("cl"),nom:d.n_nom.trim(),tel:d.n_tel.trim(),tel2:"",adresses:[],note:""};}
  else cl=cli(d.client);
  if(!cl)return toast("Choisissez un client","err"),false;
  if(d.client==="__new"||d.adresse==="__new"){if(!d.a_q.trim()&&!d.a_rep.trim())return toast("Renseignez le quartier ou un point de repère","err"),false;
   ad={id:uid("a"),libelle:"Livraison",zone:d.a_zone,quartier:d.a_q.trim(),repere:d.a_rep.trim(),gps:null,instructions:d.a_ins.trim(),defaut:!cl.adresses.length};cl.adresses.push(ad)}
  else ad=cl.adresses.find(a=>a.id===d.adresse);
  if(!ad)return toast("Choisissez une adresse","err"),false;
  const lignes=[...f.querySelectorAll(".lrow")].map(r=>({produit_id:r.querySelector(".l_prod").value,qte:+r.querySelector(".l_qte").value,pu:+r.querySelector(".l_pu").value})).filter(l=>l.produit_id&&l.qte>0);
  if(!lignes.length)return toast("Ajoutez au moins un produit","err"),false;
  if(d.client==="__new")S.clients.push(cl);
  const c=creerCmd({client_id:cl.id,adr:Object.assign({},ad),lignes,frais:d.frais,remise:d.remise,paiement:d.paiement,acompte:d.acompte,mode:d.mode,priorite:d.priorite,canal:d.canal,obs:d.obs,confirmer:!!d.confirmer});
  save();toast("Commande "+c.numero+" créée","ok");render()}});
 fillAdr();addLigne();recalc()}
function fillAdr(){const cl=cli($("#f_client").value),sel=$("#f_adr");
 const isNew=$("#f_client").value==="__new";
 sel.innerHTML=cl?cl.adresses.map(a=>`<option value="${a.id}" ${a.defaut?"selected":""}>${esc(a.libelle)} — ${esc(a.zone)} ${esc(a.quartier||"")}</option>`).join("")+'<option value="__new">➕ Nouvelle adresse</option>':'<option value="__new">Saisir l\'adresse ci-dessous</option>';
 $("#newcl").classList.toggle("hide",!isNew);$("#newadr").classList.toggle("hide",!(isNew||sel.value==="__new"));
 autoFrais()}
function autoFrais(){const cl=cli($("#f_client").value),a=cl&&cl.adresses.find(x=>x.id===$("#f_adr").value);let zn=a?a.zone:null;
 if(!a&&$("#newadr:not(.hide) select"))zn=$("#newadr select").value;if(zn&&zone(zn))$("#f_frais").value=zone(zn).frais;recalc()}
function addLigne(){const d=document.createElement("div");d.className="lrow flex";d.style.marginBottom="6px";
 d.innerHTML=`<select class="l_prod" style="flex:2">${S.produits.filter(p=>p.actif).map(p=>`<option value="${p.id}" data-p="${p.prix}">${esc(p.nom)} (stock ${p.stock})</option>`).join("")}</select><input class="l_qte" type="number" min="1" value="1" style="width:70px"><input class="l_pu" type="number" min="0" style="width:100px"><button type="button" class="btn sm er" data-act="delLigne">✕</button>`;
 $("#lignes").appendChild(d);d.querySelector(".l_pu").value=d.querySelector(".l_prod option:checked").dataset.p;recalc()}
function recalc(){const rows=[...document.querySelectorAll(".lrow")];const prods=rows.reduce((a,r)=>a+(+r.querySelector(".l_qte").value||0)*(+r.querySelector(".l_pu").value||0),0);
 const tot=Math.max(0,prods+(+$("#f_frais").value||0)-(+$("#f_remise").value||0));const pay=$("#f_pay").value;
 $("#f_acompte").disabled=pay!=="partiel";const ac=pay==="avance"?tot:pay==="partiel"?Math.min(+$("#f_acompte").value||0,tot):0;
 $("#t_prod").textContent=fcfa(prods);$("#t_tot").textContent=fcfa(tot);$("#t_solde").textContent=fcfa(tot-ac)}
document.addEventListener("change",e=>{
 if(!$("#mf")||!$("#f_client"))return;const t=e.target;
 if(t.id==="f_client")fillAdr();else if(t.id==="f_adr"){fillAdr()}
 else if(t.matches(".l_prod")){t.closest(".lrow").querySelector(".l_pu").value=t.selectedOptions[0].dataset.p;recalc()}
 else if(t.name==="a_zone")autoFrais();
 if(t.matches("#f_pay,#f_frais,#f_remise"))recalc()});
document.addEventListener("input",e=>{if($("#f_client")&&e.target.matches(".l_qte,.l_pu,#f_acompte,#f_frais,#f_remise"))recalc()});

function cmdDetail(id){
 const c=cmd(id),cl=cli(c.client_id),a=c.adr,ls=livsOf(c.id),act=activeLiv(c.id);
 const b=[];
 if(can("admin","commercial","superviseur")&&["brouillon","attente"].includes(c.statut))b.push(`<button class="btn ok" data-act="cmdConfirm" data-id="${c.id}">Confirmer</button>`);
 if(can("admin","preparateur")){if(c.statut==="confirmee")b.push(`<button class="btn" data-act="cmdPrep" data-id="${c.id}">${c.vendeur_id?"Marchandise reçue — démarrer la préparation":"Démarrer la préparation"}</button>`);if(c.statut==="preparation")b.push(`<button class="btn ok" data-act="cmdPrete" data-id="${c.id}">Marquer prête</button>`)}
 if(can("admin","superviseur")){if(c.statut==="prete")b.push(`<button class="btn" data-act="assign" data-id="${c.id}">Affecter un livreur</button>`);
  if(act)b.push(`<button class="btn wa" data-act="assign" data-id="${c.id}">Réaffecter</button>`);
  if(c.statut==="echouee")b.push(`<button class="btn" data-act="reprog" data-id="${c.id}">Reprogrammer</button><button class="btn wa" data-act="orgRetour" data-id="${c.id}">Organiser le retour</button>`);
  if(c.statut==="retour_cours")b.push(`<button class="btn" data-act="recepRetour" data-id="${c.id}">Réceptionner le retour</button>`)}
 if((can("admin","superviseur","commercial")&&!["livree","annulee","retour_recu","retour_cours","en_cours"].includes(c.statut))||(can("vendeur")&&["attente","confirmee"].includes(c.statut)))b.push(`<button class="btn er" data-act="cmdAnnul" data-id="${c.id}">Annuler</button>`);
 b.push(`<button class="btn ghost" data-act="printBL" data-id="${c.id}">🖨 Bon de livraison</button>`);
 if(can("admin"))b.push(`<button class="btn ghost" data-act="forceStatut" data-id="${c.id}">Correction exceptionnelle</button>`);
 modal(c.numero+" — "+cl.nom,`<div class="flex">${sb(c)}${c.priorite==="urgente"?badge("URGENT","er"):""}${badge(c.canal,"mu")}</div>
 <div class="pill"><b>Destination</b> : ${esc(a.libelle||"")} · ${esc(a.zone)} ${esc(a.quartier||"")}<br>Repère : ${esc(a.repere||"—")}${a.instructions?"<br>Instructions : "+esc(a.instructions):""}<br>Tél. client : <a href="tel:${esc(cl.tel)}">${esc(cl.tel)}</a><br>${geoBadge(a)}${can("admin","superviseur","commercial")?geoBtns(cl.id,a.id):can("vendeur")?`<div class="flex noprint" style="margin-top:6px"><button type="button" class="btn sm ghost" data-act="geoLink" data-id="${cl.id}|${a.id}">🔗 Lien portail client (position)</button></div>`:""}</div>
 ${tbl(["Produit","Qté","P.U.","Total"],c.lignes.map(l=>`<tr><td>${esc(lname(l))}</td><td>${l.qte}</td><td>${fcfa(l.pu)}</td><td>${fcfa(l.qte*l.pu)}</td></tr>`))}
 <div class="pill">Produits ${fcfa(c.montant_produits)} + livraison ${fcfa(c.frais)} − remise ${fcfa(c.remise)} = <b>${fcfa(c.total)}</b><br>Déjà payé : ${fcfa(paye(c))} · Reste dû : <b>${fcfa(soldeCmd(c))}</b> (${c.paiement==="avance"?"payé d'avance":c.paiement==="partiel"?"paiement partiel":"à la livraison"})</div>
 ${c.obs?`<div class="pill">Observations : ${esc(c.obs)}</div>`:""}
 ${act&&!can("vendeur")?`<div class="pill"><b>Mission en cours</b> : ${esc(liv(act.livreur_id).nom)} · ${lb(act)} · code client <b style="font-size:18px">${act.code}</b> <a class="btn sm ghost" target="_blank" rel="noopener" href="${waLink(cl.tel,`ANGEL'S GROUP — votre livraison ${c.numero} arrive. Code de confirmation à donner au livreur : ${act.code}`)}">Envoyer le code (WhatsApp)</a></div>`:""}
 ${ls.length&&!can("vendeur")?`<div class="sec">Livraisons (${ls.length})</div>${tbl(["Tentative","Livreur","Statut","Encaissé","Détail"],ls.map(l=>`<tr><td>#${l.tentative}</td><td>${esc(liv(l.livreur_id).nom)}</td><td>${lb(l)}</td><td>${l.montant_encaisse!=null?fcfa(l.montant_encaisse):"—"}</td><td class="sm">${esc(l.motif_echec||l.motif||"")}${l.recu_par?"Reçu par "+esc(l.recu_par):""}</td></tr>`))}`:""}
 <div class="sec">Historique</div><div class="sm">${c.hist.slice().reverse().map(h=>`<div>${fdt(h.ts)} — <b>${ST[h.a]}</b> · ${can("vendeur")?"":esc(h.par)}${h.note&&!can("vendeur")?" · "+esc(h.note):""}</div>`).join("")}</div>
 <div class="flex noprint">${b.join("")}</div>`,{wide:true,focus:false})}
function printBL(c){
 const cl=cli(c.client_id),w=window.open("","_blank");if(!w)return toast("Autorisez les fenêtres pop-up pour imprimer","err");
 w.document.write(`<html><head><title>${c.numero}</title><style>body{font:14px system-ui;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:6px;text-align:left}</style></head><body><h2>ANGEL'S GROUP — Bon de livraison</h2><p><b>${c.numero}</b> · ${new Date(c.date).toLocaleString("fr-FR")}<br>Client : ${esc(cl.nom)} · ${esc(cl.tel)}<br>Destination : ${esc(c.adr.zone)} ${esc(c.adr.quartier||"")} — ${esc(c.adr.repere||"")}</p><table><tr><th>Produit</th><th>Qté</th><th>P.U.</th><th>Total</th></tr>${c.lignes.map(l=>`<tr><td>${esc(lname(l))}</td><td>${l.qte}</td><td>${fcfa(l.pu)}</td><td>${fcfa(l.qte*l.pu)}</td></tr>`).join("")}</table><p>Livraison : ${fcfa(c.frais)} · Remise : ${fcfa(c.remise)}<br><b>Total : ${fcfa(c.total)}</b> · Reste à payer : <b>${fcfa(soldeCmd(c))}</b></p><p style="margin-top:50px">Nom et signature du destinataire : ________________________</p></body></html>`);
 w.document.close();w.focus();w.print()}

function assignModal(c){
 const old=activeLiv(c.id),zn=c.adr.zone;
 const list=S.livreurs.map(l=>{const n=S.livraisons.filter(x=>x.livreur_id===l.id&&isActive(x)).length,mo=l.moto_id&&moto(l.moto_id),bloque=mo&&!["disponible","affectee"].includes(mo.statut),ind=l.statut!=="disponible";
  return{l,n,mo,bloque,ind,sc:(ind?10:0)+(bloque?100:0)+n*2+(l.zone===zn?-3:0)+(old&&old.livreur_id===l.id?200:0)}}).sort((a,b)=>a.sc-b.sc);
 modal((old?"Réaffecter ":"Affecter ")+c.numero,`<div class="pill">${c.adr.gps?"":`<div class="al warn sm">Adresse non géolocalisée : le livreur n'aura pas de carte. Demandez la position au client (portail).</div>`}Destination : <b>${esc(zn)}</b> ${esc(c.adr.quartier||"")} · À encaisser : <b>${fcfa(soldeCmd(c))}</b> ${c.priorite==="urgente"?badge("URGENT","er"):""}</div>
 ${list.map((x,i)=>`<label style="display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:9px;color:var(--tx);${x.bloque?"opacity:.5":""}"><input type="radio" name="lid" value="${x.l.id}" style="width:auto" ${i===0&&!x.bloque?"checked":""} ${x.bloque||(old&&old.livreur_id===x.l.id)?"disabled":""}>
 <span style="flex:1"><b>${esc(x.l.nom)}</b> ${x.l.zone===zn?badge("même zone","ok"):""} ${x.ind?badge("indisponible","er"):""}<br><span class="sm mu">${x.n} mission(s) active(s) · moto ${x.mo?esc(x.mo.immat)+" ("+x.mo.statut+")":"non affectée"} · position : ${fraicheur(S.pos[x.l.id]).t}</span></span></label>`).join("")}
 ${old?`<label>Motif de la réaffectation (obligatoire)<input name="motif" required></label>`:""}
 <div class="sm mu">Le tri propose d'abord les livreurs disponibles, de la même zone et peu chargés. La décision reste la vôtre.</div>`,
 {label:"Valider",onSubmit:d=>{if(!d.lid)return toast("Choisissez un livreur","err"),false;
  const lv=liv(d.lid);if(lv.statut!=="disponible"&&!confirm(lv.nom+" est indisponible. Affecter quand même ?"))return false;
  const l=affecter(c,d.lid,d.motif||"");if(!l)return false;save();toast("Affectée à "+lv.nom+" — code client "+l.code,"ok");render()}})}

/* ---------- Centre de livraison ---------- */
VIEWS.livraisons=()=>{
 const fz=ui.fz||"",fl=ui.fl||"";
 const prete=S.commandes.filter(c=>c.statut==="prete").sort((a,b)=>(b.priorite==="urgente")-(a.priorite==="urgente")||new Date(a.date)-new Date(b.date));
 const act=S.livraisons.filter(l=>isActive(l)&&(!fz||cmd(l.commande_id).adr.zone===fz)&&(!fl||l.livreur_id===fl));
 const sel=ui.mapLiv&&S.pos[ui.mapLiv];
 const iframe=sel?`<div class="card"><div class="between"><b>Dernière position de ${esc(liv(ui.mapLiv).nom)}</b>${badge(fraicheur(sel).t,fraicheur(sel).k)}</div><iframe style="width:100%;height:280px;border:0;margin-top:8px;border-radius:8px" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${sel.lng-0.012},${sel.lat-0.01},${sel.lng+0.012},${sel.lat+0.01}&layer=mapnik&marker=${sel.lat},${sel.lng}"></iframe><div class="sm mu">Carte OpenStreetMap (connexion Internet requise). Précision ±${Math.round(sel.acc||0)} m. <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${sel.lat}&mlon=${sel.lng}#map=16/${sel.lat}/${sel.lng}">Ouvrir en grand</a></div></div>`:"";
 const ecarts=S.livraisons.filter(l=>l.ecart_statut==="a_valider");
 return`<h1>Centre de livraison</h1>
 <h2>À affecter (${prete.length})</h2>${tbl(["Commande","Destination","À encaisser","Priorité",""],prete.map(c=>`<tr><td><b>${c.numero}</b><br><span class="sm mu">${esc(cli(c.client_id).nom)}</span></td><td>${esc(c.adr.zone)} ${esc(c.adr.quartier||"")}</td><td>${fcfa(soldeCmd(c))}</td><td>${c.priorite==="urgente"?badge("URGENT","er"):badge(c.priorite,"mu")}</td><td><button class="btn sm" data-act="assign" data-id="${c.id}">Affecter</button></td></tr>`),"Aucune commande en attente d'affectation")}
 <div class="between"><h2>Courses actives (${act.length})</h2><div class="flex"><select data-f="fz" style="width:auto"><option value="">Toutes zones</option>${opts(S.config.zones.map(z=>z.nom),fz)}</select><select data-f="fl" style="width:auto"><option value="">Tous livreurs</option>${opts(S.livreurs.map(l=>({v:l.id,t:l.nom})),fl)}</select></div></div>
 ${tbl(["Commande","Livreur","Statut","Destination","Position GPS","Délai",""],act.map(l=>{const c=cmd(l.commande_id),z=zone(c.adr.zone),f=fraicheur(S.pos[l.livreur_id]),min=Math.round((Date.now()-new Date(l.affectee_at))/60000),lim=z?z.delai_min:60;
  return`<tr><td><b>${c.numero}</b>${c.priorite==="urgente"?" "+badge("URGENT","er"):""}<br><span class="sm mu">${fcfa(l.montant_attendu)} à encaisser</span></td><td>${esc(liv(l.livreur_id).nom)}</td><td>${lb(l)}</td><td>${esc(c.adr.zone)} ${esc(c.adr.quartier||"")}</td><td>${badge(f.t,f.k)}${S.pos[l.livreur_id]?` <a href="#" data-act="mapLiv" data-id="${l.livreur_id}">carte</a>`:""}</td><td>${min>lim?badge("Retard +"+(min-lim)+" min","er"):badge(min+"/"+lim+" min","ok")}</td><td><button class="btn sm ghost" data-act="cmdDetail" data-id="${c.id}">Ouvrir</button></td></tr>`}),"Aucune course active")}
 ${iframe}
 <h2>Livreurs</h2><div class="grid">${S.livreurs.map(l=>{const n=S.livraisons.filter(x=>x.livreur_id===l.id&&isActive(x)).length,f=fraicheur(S.pos[l.id]);return`<div class="card" style="margin:0"><b>${esc(l.nom)}</b><br>${n?badge("En mission ("+n+")","wa"):l.statut==="disponible"?badge("Disponible","ok"):badge("Indisponible","er")}<div class="sm mu" style="margin-top:6px">Zone ${esc(l.zone)}<br>GPS : ${f.t}</div>${S.pos[l.id]?`<a href="#" data-act="mapLiv" data-id="${l.id}" class="sm">Voir sur la carte</a>`:""}</div>`}).join("")}</div>
 <h2>Livraisons échouées à traiter</h2>${tbl(["Commande","Motif","Tentatives",""],S.commandes.filter(c=>c.statut==="echouee").map(c=>{const l=livsOf(c.id).filter(x=>x.statut==="echouee").slice(-1)[0];return`<tr><td><b>${c.numero}</b><br><span class="sm mu">${esc(cli(c.client_id).nom)}</span></td><td>${esc(l?l.motif_echec:"")}</td><td>${livsOf(c.id).filter(x=>["livree","echouee"].includes(x.statut)).length}</td><td><button class="btn sm" data-act="cmdDetail" data-id="${c.id}">Traiter</button></td></tr>`}),"Rien à traiter")}
 <h2>Écarts d'encaissement à valider (${ecarts.length})</h2>${ecartsTable(ecarts)}`};
function ecartsTable(list){return tbl(["Commande","Livreur","Attendu","Déclaré","Écart","Explication",""],list.map(l=>{const c=cmd(l.commande_id);return`<tr><td>${c.numero}</td><td>${esc(liv(l.livreur_id).nom)}</td><td>${fcfa(l.montant_attendu)}</td><td>${fcfa(l.montant_encaisse)}</td><td><b style="color:var(--er)">${l.ecart>0?"+":""}${fcfa(l.ecart)}</b></td><td class="sm">${esc(l.ecart_note)}</td><td>${can("admin","superviseur","direction")?`<button class="btn sm ok" data-act="ecartOk" data-id="${l.id}">Accepter</button> <button class="btn sm er" data-act="ecartKo" data-id="${l.id}">Rejeter</button>`:""}</td></tr>`}),"Aucun écart en attente")}

/* ---------- Clients ---------- */
VIEWS.clients=()=>{
 const q=(ui.cq||"").toLowerCase();
 const rows=S.clients.filter(c=>!q||(c.nom+c.tel).toLowerCase().includes(q)).map(c=>{const cs=S.commandes.filter(x=>x.client_id===c.id),du=cs.filter(x=>x.statut==="livree").reduce((a,x)=>a+soldeCmd(x),0);

VIEWS.finance=()=>{
 const t=ui.fin||"enc";

 let body="";
 if(t==="enc"){
  const rows=S.livreurs.map(l=>{const att=S.livraisons.filter(x=>x.livreur_id===l.id&&isActive(x)).reduce((a,x)=>a+x.montant_attendu,0),s=soldeLiv(l.id);
   return`<tr><td><b>${esc(l.nom)}</b></td><td>${fcfa(att)}</td><td>${fcfa(encaisseLiv(l.id))}</td><td>${fcfa(reverseLiv(l.id))}</td><td><b style="color:${s>0?"var(--er)":"var(--ok)"}">${fcfa(s)}</b></td><td>${can("admin","caissier")&&s>0?`<button class="btn sm" data-act="reverser" data-id="${l.id}">Enregistrer un reversement</button>`:""}</td></tr>`});
  body=`${tbl(["Livreur","Attendu (courses actives)","Encaissé (déclaré)","Reversé (validé)","Restant à reverser",""],rows)}<p class="mu sm">Un montant n'est considéré comme reversé que lorsqu'un caissier ou un administrateur l'enregistre : la déclaration du livreur ne suffit jamais.</p>
  <h2>Journal des mouvements de fonds</h2>${tbl(["Date","Type","Livreur","Commande","Montant","Mode","Validé / saisi par"],S.fonds.slice(-40).reverse().map(f=>`<tr><td>${fdt(f.ts)}</td><td>${badge({acompte:"Acompte",encaissement:"Encaissement",reversement:"Reversement"}[f.type],f.type==="reversement"?"ok":"")}</td><td>${f.livreur_id?esc(liv(f.livreur_id).nom):"—"}</td><td>${f.commande_id?cmd(f.commande_id).numero:"—"}</td><td><b>${fcfa(f.montant)}</b></td><td>${esc(f.mode||"")}</td><td>${esc(f.par)}</td></tr>`))}`}
 if(t==="ecarts")body=ecartsTable(S.livraisons.filter(l=>l.ecart_statut==="a_valider"))+`<h2>Écarts traités</h2>`+tbl(["Commande","Livreur","Écart","Décision","Par"],S.livraisons.filter(l=>l.ecart_statut&&l.ecart_statut!=="a_valider").map(l=>`<tr><td>${cmd(l.commande_id).numero}</td><td>${esc(liv(l.livreur_id).nom)}</td><td>${fcfa(l.ecart)}</td><td>${l.ecart_statut==="valide"?badge("Accepté","ok"):badge("Rejeté","er")} <span class="sm">${esc(l.ecart_decision||"")}</span></td><td>${esc(l.ecart_par||"")}</td></tr>`),"Aucun");
 if(t==="comm")body=tbl(["Livreur","Livraisons réussies","Commission acquise","Payé / avances","Reste à payer",""],S.livreurs.map(l=>{const a=commAcquise(l.id),p=commPayee(l.id);return`<tr><td><b>${esc(l.nom)}</b></td><td>${S.livraisons.filter(x=>x.livreur_id===l.id&&x.statut==="livree").length}</td><td>${fcfa(a)}</td><td>${fcfa(p)}</td><td><b>${fcfa(a-p)}</b></td><td>${can("admin","caissier")?`<button class="btn sm" data-act="payer" data-id="${l.id}">Payer / avance</button>`:""}</td></tr>`}))+`<p class="mu sm">Règles configurables par livreur (fixe, % des frais ou mixte). Les retenues éventuelles doivent être définies selon les règles contractuelles et légales applicables.</p>`;
 if(t==="dep")body=`${can("admin","caissier")?'<button class="btn" data-act="newDep">➕ Dépense de mission</button>':""}${tbl(["Date","Livreur","Nature","Mission","Montant","Saisi par"],S.depenses.slice().reverse().map(d=>`<tr><td>${fdt(d.ts)}</td><td>${esc(liv(d.livreur_id).nom)}</td><td>${esc(d.nature)}</td><td>${d.commande_id?cmd(d.commande_id).numero:"—"}</td><td>${fcfa(d.montant)}</td><td>${esc(d.par)}</td></tr>`),"Aucune dépense")}`;
 if(t==="renta"){
  const rl=S.livreurs.map(l=>{const ok=S.livraisons.filter(x=>x.livreur_id===l.id&&x.statut==="livree"),fr=ok.reduce((a,x)=>a+cmd(x.commande_id).frais,0),co=commAcquise(l.id),de=S.depenses.filter(d=>d.livreur_id===l.id).reduce((a,d)=>a+d.montant,0);return{n:l.nom,k:ok.length,fr,co,de}});
  const rz=S.config.zones.map(z=>{const ok=S.livraisons.filter(x=>x.statut==="livree"&&cmd(x.commande_id).adr.zone===z.nom),fr=ok.reduce((a,x)=>a+cmd(x.commande_id).frais,0),co=ok.reduce((a,x)=>a+commissionLiv(x),0),de=S.depenses.filter(d=>d.commande_id&&cmd(d.commande_id).adr.zone===z.nom).reduce((a,d)=>a+d.montant,0);return{n:z.nom,k:ok.length,fr,co,de}}).filter(z=>z.k);
  const row=r=>`<tr><td>${esc(r.n)}</td><td>${r.k}</td><td>${fcfa(r.fr)}</td><td>${fcfa(r.co)}</td><td>${fcfa(r.de)}</td><td><b style="color:${r.fr-r.co-r.de<0?"var(--er)":"var(--ok)"}">${fcfa(r.fr-r.co-r.de)}</b></td></tr>`;
  body=`<h2>Par livreur</h2>${tbl(["Livreur","Livraisons","Frais facturés","Commissions","Dépenses","Marge estimée"],rl.map(row))}<h2>Par zone</h2>${tbl(["Zone","Livraisons","Frais facturés","Commissions","Dépenses","Marge estimée"],rz.map(row),"Aucune livraison")}<p class="mu sm">Marge estimée = frais de livraison − commissions − dépenses. Elle exclut le coût des produits, le carburant non saisi et l'entretien des motos : à ne pas confondre avec le bénéfice réel.</p>`}
 if(t==="ven")body=tbl(["Vendeur","Commission","Net acquis (livré et encaissé)","Déjà réglé","Reste à régler",""],S.vendeurs.map(v=>{const d=vendDue(v);return`<tr><td><b>${esc(v.nom)}</b></td><td>${v.commission_pct||0} %</td><td>${fcfa(d.acquis)}</td><td>${fcfa(d.regle)}</td><td><b style="color:${d.restant>0?"var(--er)":"var(--ok)"}">${fcfa(d.restant)}</b></td><td>${can("admin","caissier")&&d.restant>0?`<button class="btn sm" data-act="vReg" data-id="${v.id}">Enregistrer un règlement</button>`:""}</td></tr>`}),"Aucun vendeur partenaire")+`<p class="mu sm">Règle : pour chaque commande livrée dont le client a tout payé, le vendeur reçoit le prix de ses articles moins sa commission. La livraison reste acquise à ANGEL'S GROUP. Vérifiez que le livreur a bien reversé l'argent avant de régler le vendeur. Les commandes déjà payées au vendeur ne génèrent aucun règlement.</p>`;
 return`<h1>Finance</h1>${T}${body}`};

let watchId=null,lastSent=0;
function syncGPS(){
 const lv=ME&&livreurOf(ME);const need=lv&&lv.gps_consent&&S.livraisons.some(l=>l.livreur_id===lv.id&&l.statut==="en_cours");
 if(need&&watchId==null&&navigator.geolocation){watchId=navigator.geolocation.watchPosition(pushPos,e=>{ui.gpsErr=e.message},{enableHighAccuracy:true,maximumAge:10000,timeout:30000})}
 if(!need&&watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}}
function pushPos(p,force){
 const lv=ME&&livreurOf(ME);if(!lv)return;const t=Date.now();if(!force&&t-lastSent<S.config.gps_interval*1000)return;lastSent=t;
 const l=S.livraisons.find(x=>x.livreur_id===lv.id&&x.statut==="en_cours");
 const pt={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0),ts:now(),livraison_id:l?l.id:null};
 S.pos[lv.id]=pt;S.gps_hist.push(Object.assign({livreur_id:lv.id},pt));if(S.gps_hist.length>3000)S.gps_hist.splice(0,500);save()}
function sendPosNow(){if(!navigator.geolocation)return toast("Géolocalisation non disponible sur cet appareil","err");
 navigator.geolocation.getCurrentPosition(p=>{pushPos(p,true);toast("Position envoyée","ok");render()},e=>toast("Position impossible : "+e.message,"err"),{enableHighAccuracy:true,timeout:15000})}
function livreurHTML(){
 const lv=livreurOf(ME);if(!lv)return`<div class="lv"><div class="card">Compte livreur non rattaché. <a data-act="logout" href="#">Déconnexion</a></div></div>`;
 const mine=S.livraisons.filter(l=>l.livreur_id===lv.id),todo=mine.filter(isActive),today=new Date().toDateString(),done=mine.filter(l=>["livree","echouee"].includes(l.statut)&&new Date(l.fin_at).toDateString()===today);
 const aEnc=todo.reduce((a,l)=>a+l.montant_attendu,0),det=soldeLiv(lv.id);
 return`<div class="lv"><div class="lvh"><div class="between"><div><b style="font-size:17px">${esc(lv.nom)}</b><br><span style="opacity:.75" class="sm">${lv.statut==="disponible"?"🟢 Disponible":"🔴 Indisponible"}</span></div><div class="flex"><button class="btn sm ghost" data-act="myStatus">Statut</button><button class="btn sm ghost" data-act="logout">⏏</button></div></div>
 <div class="grid" style="margin-top:10px;grid-template-columns:repeat(3,1fr)"><div><div style="font-size:20px;font-weight:800">${todo.length}</div><div class="sm" style="opacity:.75">à faire</div></div><div><div style="font-size:20px;font-weight:800">${done.filter(l=>l.statut==="livree").length}</div><div class="sm" style="opacity:.75">livrées aujourd'hui</div></div><div><div style="font-size:20px;font-weight:800">${fcfa(det)}</div><div class="sm" style="opacity:.75">à reverser</div></div></div></div>
 ${aEnc?`<div class="al warn">Montants à encaisser sur vos courses : <b>${fcfa(aEnc)}</b></div>`:""}
 ${todo.length?todo.map(missionCard).join(""):'<div class="card mu">Aucune mission pour le moment. Les nouvelles missions apparaissent ici.</div>'}
 <div class="flex" style="margin:8px 0"><button class="btn ghost" data-act="myInc">⚠ Signaler un incident</button><button class="btn ghost" data-act="sendPos">📍 Envoyer ma position</button></div>
 ${S.pos[lv.id]?`<div class="sm mu">Dernière position partagée : ${fraicheur(S.pos[lv.id]).t}</div>`:""}
 <h2>Terminées aujourd'hui (${done.length})</h2>${done.map(l=>{const c=cmd(l.commande_id);return`<div class="pill" style="margin-bottom:6px"><div class="between"><b>${c.numero}</b>${lb(l)}</div><span class="sm mu">${esc(cli(c.client_id).nom)} · ${l.statut==="livree"?"encaissé "+fcfa(l.montant_encaisse):esc(l.motif_echec||"")}</span></div>`}).join("")||'<div class="mu sm">Rien pour l\'instant.</div>'}</div>`}
function missionCard(l){
 const c=cmd(l.commande_id),a=c.adr,cl=cli(c.client_id);
 const dest=a.gps?`${a.gps.lat},${a.gps.lng}`:encodeURIComponent([a.quartier,a.zone,"Abidjan"].filter(Boolean).join(", "));
 let btn="";
 if(l.statut==="affectee")btn=`<div class="row"><button class="btn ok" data-act="lAcc" data-id="${l.id}">✔ Accepter</button><button class="btn er" data-act="lRef" data-id="${l.id}">✖ Impossible</button></div>`;
 if(l.statut==="acceptee")btn=!l.collecte_at?`<div class="row"><button class="btn" data-act="lPrise" data-id="${l.id}">📦 Colis pris en charge</button></div><div class="row"><button class="btn er" data-act="lRef" data-id="${l.id}">✖ Impossible</button></div>`:`<div class="row"><button class="btn ok" data-act="lGo" data-id="${l.id}">🏍 Démarrer la course</button></div>`;

 return`<div class="mc ${c.priorite==="urgente"?"urg":""}"><div class="between"><b>${c.numero}</b><span>${c.priorite==="urgente"?badge("URGENT","er")+" ":""}${lb(l)}</span></div>
 <div><b>${esc(cl.nom)}</b><br>📍 ${esc(a.zone)} · ${esc(a.quartier||"")}<br><span class="mu">${esc(a.repere||"")}</span>${a.instructions?`<br><i>${esc(a.instructions)}</i>`:""}</div>
 ${a.gps?`<div class="flex sm">${geoBadge(a)}<button class="btn sm ghost" data-act="lMap" data-id="${l.id}">${ui.mapOpen&&ui.mapOpen[l.id]?"Masquer la carte":"🗺 Voir sur la carte"}</button></div>${ui.mapOpen&&ui.mapOpen[l.id]?`<div class="mapbox" id="map_${l.id}" style="height:260px;border-radius:10px;overflow:hidden;background:#e8ebf5"></div>`:""}`:`<div class="al warn sm" style="margin:0">Adresse non géolocalisée. <a href="#" data-act="lAskGeo" data-id="${l.id}">Demander sa position au client</a></div>`}
 <div class="between pill"><span>${c.lignes.reduce((s,x)=>s+x.qte,0)} article(s)${l.nb_colis?" · "+l.nb_colis+" colis":""}</span><span class="amt">${l.montant_attendu>0?fcfa(l.montant_attendu):"Déjà payé"}</span></div>
 ${c.obs?`<div class="sm">📝 ${esc(c.obs)}</div>`:""}
 <div class="row"><a class="btn ghost" style="text-align:center;text-decoration:none" href="tel:${esc(cl.tel)}">📞 Appeler</a><a class="btn ghost" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=two-wheeler">🧭 Itinéraire</a></div>${btn}</div>`}

 modal("Partage de votre position",`<p>Pendant vos courses en cours, votre position GPS est transmise au superviseur de <b>ANGEL'S GROUP</b> afin de suivre les livraisons et d'aider en cas de problème.</p><ul><li>Aucun suivi en dehors d'une course active.</li><li>L'historique est conservé ${S.config.gps_retention_jours} jours, accessible aux seules personnes autorisées.</li></ul><p class="mu sm">Ne manipulez pas votre téléphone en conduisant.</p>`,

   ============================================================ */
function vendDue(v){
 const mine=S.commandes.filter(c=>c.vendeur_id===v.id);
 const net=c=>Math.round((c.montant_produits-c.remise)*(1-(+v.commission_pct||0)/100));
 const elig=mine.filter(c=>c.statut==="livree"&&!c.vendeur_encaisse&&soldeCmd(c)===0);
 const acquis=elig.reduce((a,c)=>a+net(c),0),regle=S.reglements.filter(r=>r.vendeur_id===v.id).reduce((a,r)=>a+r.montant,0);
 const attente=mine.filter(c=>["confirmee","preparation","prete","affectee","en_cours"].includes(c.statut)&&!c.vendeur_encaisse).reduce((a,c)=>a+net(c),0);
 return{acquis,regle,restant:acquis-regle,attente,elig,net}}
const normTxt=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function creerCmdVendeur(v,d){
 const tel=d.tel.replace(/\s/g,"");
 let cl=S.clients.find(c=>c.vendeur_id===v.id&&c.tel.replace(/\s/g,"")===tel);
 if(!cl){cl={id:uid("cl"),nom:d.nom.trim(),tel:d.tel.trim(),tel2:"",adresses:[],note:"",vendeur_id:v.id};S.clients.push(cl)}
 let ad=cl.adresses.find(a=>a.zone===d.zone&&normTxt(a.quartier)===normTxt(d.quartier)&&normTxt(a.repere)===normTxt(d.repere));
 if(!ad){ad={id:uid("a"),libelle:"Livraison",zone:d.zone,quartier:(d.quartier||"").trim(),repere:(d.repere||"").trim(),gps:null,instructions:(d.ins||"").trim(),defaut:!cl.adresses.length};cl.adresses.push(ad)}
 const prods=d.lignes.reduce((a,l)=>a+l.qte*l.pu,0),paye=d.pay==="paye";
 const c=creerCmd({vendeur_id:v.id,vendeur_encaisse:paye,client_id:cl.id,adr:Object.assign({},ad),lignes:d.lignes.map(l=>({produit_id:null,desig:l.desig,qte:l.qte,pu:l.pu})),frais:(zone(d.zone)||{}).frais||0,remise:0,paiement:paye?"partiel":"livraison",acompte:paye?prods:0,mode:paye?"Payé au vendeur":"Espèces",priorite:"normale",canal:"Vendeur partenaire",obs:d.obs||"",confirmer:false});
 setStatut(c,"attente","Commande déposée par le vendeur");return c}

/* Import CSV : ref;client;tel;zone;quartier;repere;article;qte;prix */
function parseCSV(t){
 const lines=String(t).split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return{orders:[],err:["Fichier vide"]};
 const cnt=x=>(lines[0].split(x).length-1),sep=[";","\t",","].sort((a,b)=>cnt(b)-cnt(a))[0];
 const cell=x=>x.trim().replace(/^"|"$/g,"").trim();
 let start=0;if(/^(ref|r[eé]f|client|nom)/i.test(cell(lines[0].split(sep)[0])||""))start=1;
 const orders=new Map(),err=[];
 for(let i=start;i<lines.length;i++){const c=lines[i].split(sep).map(cell),n="Ligne "+(i+1)+" : ";
  const [ref,nom,tel,zn,quartier,repere,article,qte,prix]=c;const z=S.config.zones.find(z=>normTxt(z.nom)===normTxt(zn));
  const q=+String(qte).replace(",","."),pu=+String(prix).replace(/\s/g,"").replace(",",".");
  if(!nom||!tel){err.push(n+"nom et téléphone requis");continue}
  if(!z){err.push(n+"zone inconnue « "+(zn||"")+" » (zones : "+S.config.zones.map(z=>z.nom).join(", ")+")");continue}
  if(!quartier&&!repere){err.push(n+"quartier ou repère requis");continue}
  if(!article){err.push(n+"article manquant");continue}
  if(!(q>0)||!Number.isInteger(q)){err.push(n+"quantité invalide");continue}
  if(!(pu>=0)||isNaN(pu)){err.push(n+"prix invalide");continue}
  const key=ref||"L"+i;let o=orders.get(key);
  if(!o){o={nom,tel,zone:z.nom,quartier:quartier||"",repere:repere||"",ins:"",pay:"livraison",obs:ref?"Réf. vendeur : "+ref:"",lignes:[]};orders.set(key,o)}
  else if(o.tel.replace(/\s/g,"")!==tel.replace(/\s/g,"")){err.push(n+"la référence "+ref+" est utilisée pour deux clients différents");continue}
  o.lignes.push({desig:article,qte:q,pu})}
 return{orders:[...orders.values()],err}}
function vImportModal(){
 modal("Importer des commandes (CSV)",`<p class="sm">Une ligne par article. Colonnes séparées par « ; » :<br><code>ref ; client ; tel ; zone ; quartier ; repere ; article ; qte ; prix</code><br>Les lignes qui ont la même <b>ref</b> forment une seule commande. Les commandes sont payables à la livraison.</p>
 <div class="flex"><button type="button" class="btn sm ghost" data-act="csvModel">⬇ Télécharger un modèle</button><label class="btn sm ghost" style="margin:0;cursor:pointer;display:inline-block">Choisir un fichier<input type="file" accept=".csv,.txt" id="v_file" class="hide"></label></div>
 <label>Ou collez le contenu ici<textarea name="csv" id="v_csv" rows="7" required></textarea></label>`,
 {label:"Importer",wide:true,focus:false,onSubmit:d=>{const r=parseCSV(d.csv);
  if(r.err.length)return toast(r.err.slice(0,3).join(" · ")+(r.err.length>3?" … (+"+(r.err.length-3)+" autres)":"")+" — aucune commande créée","err"),false;
  if(!r.orders.length)return toast("Aucune commande à importer","err"),false;
  const v=vend();r.orders.forEach(o=>creerCmdVendeur(v,o));audit("Import CSV vendeur",v.nom+" — "+r.orders.length+" commande(s)");save();toast(r.orders.length+" commande(s) déposée(s)","ok");render()}});
 $("#v_file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("#v_csv").value=rd.result};rd.readAsText(f)}}

/* ============================================================
   CARTES & PORTAIL CLIENT (géopositionnement de l'adresse)
   ============================================================ */
let LP=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(LP)return LP;
 LP=new Promise((ok,ko)=>{const c=document.createElement("link");c.rel="stylesheet";c.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(c);
  const sc=document.createElement("script");sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";sc.onload=ok;sc.onerror=()=>{LP=null;ko(new Error("hors ligne"))};document.head.appendChild(sc);setTimeout(()=>{if(!window.L){LP=null;ko(new Error("délai dépassé"))}},12000)});return LP}
const pinIcon=e=>L.divIcon({html:`<div style="font-size:30px;line-height:30px;transform:translate(-50%,-100%)">${e}</div>`,className:"",iconSize:[0,0]});
const osmLink=(lat,lng)=>`https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=18/${lat}/${lng}`;
/* Affiche une carte dans `el`. o.dest : destination ; o.me : position du livreur ; o.onPick(ll) : repère déplaçable */
function mapInto(el,o){
 const c=o.dest||o.center||{lat:5.345,lng:-4.02};
 return loadLeaflet().then(()=>{
  el.innerHTML="";const m=L.map(el).setView([c.lat,c.lng],o.dest?17:12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
  let mk=null;const put=ll=>{if(mk)mk.setLatLng(ll);else{mk=L.marker(ll,{icon:pinIcon("📍"),draggable:!!o.onPick}).addTo(m);if(o.onPick)mk.on("dragend",()=>o.onPick(mk.getLatLng()))}};
  if(o.dest)put([o.dest.lat,o.dest.lng]);
  if(o.me){L.marker([o.me.lat,o.me.lng],{icon:pinIcon("🏍️")}).addTo(m);if(o.dest)m.fitBounds([[o.dest.lat,o.dest.lng],[o.me.lat,o.me.lng]],{padding:[35,35],maxZoom:17})}
  if(o.onPick)m.on("click",e=>{put(e.latlng);o.onPick(e.latlng)});
  setTimeout(()=>m.invalidateSize(),150);return{map:m,put}})
 .catch(()=>{el.style.height="auto";el.innerHTML=`<div class="al warn sm" style="margin:0">Carte indisponible (pas de connexion Internet).${o.dest?` Coordonnées : ${o.dest.lat}, ${o.dest.lng} — <a target="_blank" rel="noopener" href="${osmLink(o.dest.lat,o.dest.lng)}">ouvrir</a>`:""}</div>`;return null})}
function initMaps(){if(!ME||ME.role!=="livreur")return;const lv=livreurOf(ME);if(!lv)return;
 for(const id in(ui.mapOpen||{})){if(!ui.mapOpen[id])continue;const el=$("#map_"+id),l=byId(S.livraisons,id);if(!el||!l)continue;const a=cmd(l.commande_id).adr;if(a.gps)mapInto(el,{dest:a.gps,me:S.pos[lv.id]})}}

const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))));
const portalLink=(c,a,ref)=>location.href.split("#")[0]+"#portail="+b64({cid:c.id,aid:a.id,n:c.nom,r:ref||"",a:[a.libelle,a.zone,a.quartier,a.repere].filter(Boolean).join(" · "),w:S.config.whatsapp,g:a.gps||null,org:S.config.org});
const geoBadge=a=>a.gps?badge(a.gps_src==="client"?"📍 Position confirmée par le client":"📍 Position enregistrée"+(a.gps_src?" ("+a.gps_src+")":""),"ok"):badge("Pas de position GPS","wa");
const geoBtns=(cid,aid)=>`<div class="flex noprint" style="margin-top:6px"><button type="button" class="btn sm ghost" data-act="geoLink" data-id="${cid}|${aid}">🔗 Lien portail client</button><button type="button" class="btn sm ghost" data-act="geoPick" data-id="${cid}|${aid}">📌 Placer sur la carte</button><button type="button" class="btn sm ghost" data-act="geoPaste" data-id="${cid}|${aid}">📋 Coller une position reçue</button></div>`;
function applyGeo(cid,aid,lat,lng,src,acc,note){
 const cl=cli(cid),a=cl&&cl.adresses.find(x=>x.id===aid);if(!a)return false;
 a.gps={lat:+(+lat).toFixed(6),lng:+(+lng).toFixed(6)};a.gps_src=src;a.gps_ts=now();if(acc)a.gps_acc=Math.round(acc);if(note)a.instructions=(a.instructions?a.instructions+" — ":"")+note;
 S.commandes.forEach(c=>{if(c.client_id===cid&&c.adr.id===aid&&!["livree","annulee","retour_recu"].includes(c.statut)){c.adr.gps=a.gps;c.adr.gps_src=src;if(note)c.adr.instructions=a.instructions}});
 audit("Position GPS d'une adresse",`${cl.nom} — ${src} — ${a.gps.lat}, ${a.gps.lng}`);return true}
/* Reconnaît : "lat,lng", lien Google Maps / OpenStreetMap, ou message du portail (GEO:cid|aid|lat|lng) */
function parseGeo(t){t=String(t||"");let m=t.match(/GEO:([\w-]+)\|([\w-]+)\|(-?\d+\.?\d*)\|(-?\d+\.?\d*)/);if(m)return{cid:m[1],aid:m[2],lat:+m[3],lng:+m[4]};
 m=t.match(/mlat=(-?\d+\.?\d*)&(?:amp;)?mlon=(-?\d+\.?\d*)/)||t.match(/[@?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/)||t.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/)||t.match(/#map=\d+\/(-?\d+\.?\d*)\/(-?\d+\.?\d*)/)||t.match(/(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)/);
 if(!m)return null;const lat=+m[1],lng=+m[2];return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
function geoLinkModal(cid,aid,ref){
 const c=cli(cid),a=c.adresses.find(x=>x.id===aid),link=portalLink(c,a,ref),
  msg=`Bonjour ${c.nom}, ${S.config.org}. Pour que notre livreur trouve facilement votre adresse, merci d'indiquer sa position exacte ici : ${link}`;
 modal("Portail client — "+c.nom,`<p>Envoyez ce lien au client. Il place un repère sur la carte (ou utilise sa position actuelle) et vous renvoie sa position.</p>
 <label>Lien personnel<input readonly id="gl" value="${esc(link)}" onclick="this.select()"></label>
 <div class="flex"><a class="btn" target="_blank" rel="noopener" style="text-decoration:none" href="${waLink(c.tel,msg)}">Envoyer par WhatsApp</a><button type="button" class="btn ghost" data-act="copyLink">Copier le lien</button></div>
 ${location.protocol==="file:"?`<div class="al warn sm">Ce lien pointe vers un fichier local : le client ne pourra pas l'ouvrir. Hébergez d'abord l'application sur Internet (Netlify, Vercel…) et ouvrez-la depuis son adresse web avant de générer les liens.</div>`:""}
 <div class="sm mu">Quand le client répond, utilisez « 📋 Coller une position reçue » (le message contient la position). Avec un backend partagé (étape suivante), la position se mettra à jour automatiquement.</div>`,{focus:false})}
function geoPickModal(cid,aid){
 const cl=cli(cid),a=cl.adresses.find(x=>x.id===aid);let pos=a.gps?{lat:a.gps.lat,lng:a.gps.lng}:null,h=null;
 modal("Position de livraison — "+cl.nom,`<div class="pill sm">${esc([a.libelle,a.zone,a.quartier,a.repere].filter(Boolean).join(" · "))}</div><div id="pm" style="height:320px;border-radius:10px;overflow:hidden;background:#e8ebf5"></div><div class="flex"><button type="button" class="btn sm ghost" id="pm_gps">📍 Ma position actuelle</button><span class="sm mu" id="pm_c">${pos?pos.lat+", "+pos.lng:"Touchez la carte pour placer le repère"}</span></div>`,
 {wide:true,focus:false,label:"Enregistrer la position",onSubmit:()=>{if(!pos)return toast("Placez le repère sur la carte","err"),false;applyGeo(cid,aid,pos.lat,pos.lng,"saisie par le personnel");save();toast("Position enregistrée","ok");render()}});
 const set=(lat,lng)=>{pos={lat:+lat.toFixed(6),lng:+lng.toFixed(6)};$("#pm_c").textContent=pos.lat+", "+pos.lng};
 mapInto($("#pm"),{dest:pos,onPick:ll=>set(ll.lat,ll.lng)}).then(x=>h=x);
 $("#pm_gps").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{set(p.coords.latitude,p.coords.longitude);if(h){h.put([pos.lat,pos.lng]);h.map.setView([pos.lat,pos.lng],17)}},e=>toast("Position impossible : "+e.message,"err"),{enableHighAccuracy:true,timeout:15000}):toast("Géolocalisation indisponible","err")}
function geoPasteModal(cid,aid){
 modal("Coller une position reçue",`<label>Message du client, lien Google Maps / OpenStreetMap ou coordonnées « lat, lng »<textarea name="t" rows="4" required></textarea></label>`,
 {label:"Enregistrer",onSubmit:d=>{const g=parseGeo(d.t);if(!g)return toast("Aucune position reconnue dans ce texte","err"),false;
  if(g.cid&&(g.cid!==cid||g.aid!==aid)){if(!cli(g.cid)||!confirm("Ce message concerne une autre adresse : "+cli(g.cid).nom+". L'appliquer à cette adresse-là ?"))return false;cid=g.cid;aid=g.aid}
  const note=(String(d.t).match(/Précision\s*:\s*(.+)/)||[])[1];
  if(!applyGeo(cid,aid,g.lat,g.lng,g.cid?"client":"saisie par le personnel",0,note))return toast("Adresse introuvable","err"),false;save();toast("Position enregistrée","ok");render()}})}

/* ---------- Page publique du portail client ---------- */
function renderPortal(p){
 document.title=p.org+" — Position de livraison";
 $("#app").innerHTML=`<div class="login"><div class="card"><div style="font-size:20px;font-weight:800;color:var(--b2)">${esc(p.org)}</div><div class="mu" style="margin-bottom:10px">Portail client · position de livraison</div>
 <p>Bonjour <b>${esc(p.n)}</b>,<br>pour que notre livreur trouve votre adresse sans difficulté, placez le repère 📍 à l'endroit exact où vous souhaitez être livré.</p>
 <div class="pill sm">Adresse enregistrée : ${esc(p.a)}${p.r?`<br>Référence : ${esc(p.r)}`:""}</div>
 <button class="btn" id="pt_gps" style="width:100%;margin:10px 0">📍 Utiliser ma position actuelle</button>
 <div id="pt_map" style="height:320px;border-radius:10px;overflow:hidden;background:#e8ebf5"></div>
 <div class="sm mu" style="margin:6px 0 10px">Touchez la carte ou faites glisser le repère pour ajuster.</div>
 <label>Précision utile (portail bleu, 2e étage, près de…)<input id="pt_note"></label>
 <button class="btn ok" id="pt_ok" style="width:100%;margin-top:12px" disabled>Confirmer cette position</button><div id="pt_res"></div>
 <p class="sm mu" style="margin-top:12px">Votre position n'est utilisée que pour cette livraison. Elle n'est partagée qu'avec ${esc(p.org)} et son livreur.</p></div></div>`;
 let pos=p.g?{lat:p.g.lat,lng:p.g.lng}:null,acc=0,h=null;const ok=$("#pt_ok");if(pos)ok.disabled=false;
 mapInto($("#pt_map"),{dest:pos,onPick:ll=>{pos={lat:ll.lat,lng:ll.lng};acc=0;ok.disabled=false}}).then(x=>h=x);
 $("#pt_gps").onclick=()=>{if(!navigator.geolocation)return toast("Géolocalisation indisponible sur ce téléphone","err");
  navigator.geolocation.getCurrentPosition(g=>{pos={lat:g.coords.latitude,lng:g.coords.longitude};acc=g.coords.accuracy;ok.disabled=false;if(h){h.put([pos.lat,pos.lng]);h.map.setView([pos.lat,pos.lng],18)}toast("Position trouvée. Ajustez le repère si besoin.","ok")},e=>toast("Position impossible : autorisez la localisation ou touchez la carte ("+e.message+")","err"),{enableHighAccuracy:true,timeout:20000})};
 ok.onclick=()=>{if(!pos)return;const lat=+pos.lat.toFixed(6),lng=+pos.lng.toFixed(6),note=$("#pt_note").value.trim();
  let saved=false;if(S&&cli(p.cid)){saved=applyGeo(p.cid,p.aid,lat,lng,"client",acc,note);if(saved)save()}
  const msg=`Position de livraison — ${p.n}${p.r?" ("+p.r+")":""} : ${osmLink(lat,lng)}\nGEO:${p.cid}|${p.aid}|${lat}|${lng}${note?"\nPrécision : "+note:""}`;
  let w=String(p.w||"").replace(/\D/g,"");if(w.length===10)w="225"+w;
  $("#pt_res").innerHTML=`<div class="al" style="background:var(--okbg);margin-top:12px"><b>Merci ✔</b> Votre position est prête.<br>${saved?"Elle a été enregistrée.":"Envoyez-la-nous pour que votre livreur la reçoive :"}</div>${w?`<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent(msg)}">Envoyer à ${esc(p.org)} par WhatsApp</a>`:""}<button class="btn ghost" id="pt_cp" style="width:100%;margin-top:8px">Copier le message</button>`;
  $("#pt_cp").onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(msg):Promise.reject()).then(()=>toast("Message copié","ok"),()=>prompt("Copiez ce message :",msg))};ok.textContent="Position confirmée ✔"}}

/* ---------- Démarrage ---------- */
if(location.hash.startsWith("#portail=")){
 try{const p=unb64(location.hash.slice(9));let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=d&&d.v===1?d:null;renderPortal(p)}
 catch(e){$("#app").innerHTML='<div class="login"><div class="card">Lien invalide ou expiré. Demandez-en un nouveau.</div></div>'}
}else{
 load();
 {const id=sessionStorage.getItem("angels_me");const u=id&&usr(id);if(u&&u.actif)ME=u}
 render();
}
</script>
